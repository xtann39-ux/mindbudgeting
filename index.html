<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดทำคำของบประมาณงบลงทุน - สป.อก. (Clean Edition)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Charts (for the Map) -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Sarabun (Thai) & Inter (English/Numbers) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            900: '#581c87',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f8fafc; /* Tailwind slate-50 */
            color: #334155; /* Tailwind slate-700 */
            -webkit-font-smoothing: antialiased;
        }

        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.025);
        }

        .input-field {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            background-color: #ffffff;
            border-color: #9333ea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        /* Scrollbar styling for a cleaner look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Map Tooltip fix */
        .google-visualization-tooltip {
            font-family: 'Sarabun', sans-serif !important;
            border: none !important;
            border-radius: 8px !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
            padding: 10px !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const mainCategories = ['การสร้างใหม่', 'การปรับปรุงซ่อมแซม', 'ครุภัณฑ์', 'รถยนต์'];
        
        const subTypes = {
            'การสร้างใหม่': ['ค่าก่อสร้างที่พักอาศัยและสิ่งก่อสร้างประกอบ', 'ค่าก่อสร้างที่ทำการและสิ่งก่อสร้างประกอบ', 'ค่าก่อสร้างสิ่งก่อสร้างอื่น'],
            'การปรับปรุงซ่อมแซม': ['ค่าปรับปรุงอาคารที่ทำการและสิ่งก่อสร้างประกอบ', 'ค่าปรับปรุงที่พักอาศัยและสิ่งก่อสร้างประกอบ'],
            'ครุภัณฑ์': ['ครุภัณฑ์สำนักงาน', 'ครุภัณฑ์คอมพิวเตอร์', 'ครุภัณฑ์ยานพาหนะ'],
            'รถยนต์': ['รถบรรทุก (ดีเซล)', 'รถโดยสารขนาด 12 ที่นั่ง', 'รถกระบะ']
        };

        const getCategoryFromType = (type) => {
            for (const [cat, types] of Object.entries(subTypes)) {
                if (types.includes(type)) return cat;
            }
            return 'อื่นๆ';
        };

        // ISO-3166-2 Codes for Google GeoChart (Thailand Provinces)
        const provinceMapping = {
            'กรุงเทพมหานคร': 'TH-10', 'สมุทรปราการ': 'TH-11', 'นนทบุรี': 'TH-12', 'ปทุมธานี': 'TH-13', 'พระนครศรีอยุธยา': 'TH-14',
            'อ่างทอง': 'TH-15', 'ลพบุรี': 'TH-16', 'สิงห์บุรี': 'TH-17', 'ชัยนาท': 'TH-18', 'สระบุรี': 'TH-19',
            'ชลบุรี': 'TH-20', 'ระยอง': 'TH-21', 'จันทบุรี': 'TH-22', 'ตราด': 'TH-23', 'ฉะเชิงเทรา': 'TH-24',
            'ปราจีนบุรี': 'TH-25', 'นครนายก': 'TH-26', 'สระแก้ว': 'TH-27', 'นครราชสีมา': 'TH-30', 'บุรีรัมย์': 'TH-31',
            'สุรินทร์': 'TH-32', 'ศรีสะเกษ': 'TH-33', 'อุบลราชธานี': 'TH-34', 'ยโสธร': 'TH-35', 'ชัยภูมิ': 'TH-36',
            'อำนาจเจริญ': 'TH-37', 'บึงกาฬ': 'TH-38', 'หนองบัวลำภู': 'TH-39', 'ขอนแก่น': 'TH-40', 'อุดรธานี': 'TH-41',
            'เลย': 'TH-42', 'หนองคาย': 'TH-43', 'มหาสารคาม': 'TH-44', 'ร้อยเอ็ด': 'TH-45', 'กาฬสินธุ์': 'TH-46',
            'สกลนคร': 'TH-47', 'นครพนม': 'TH-48', 'มุกดาหาร': 'TH-49', 'เชียงใหม่': 'TH-50', 'ลำพูน': 'TH-51',
            'ลำปาง': 'TH-52', 'อุตรดิตถ์': 'TH-53', 'แพร่': 'TH-54', 'น่าน': 'TH-55', 'พะเยา': 'TH-56',
            'เชียงราย': 'TH-57', 'แม่ฮ่องสอน': 'TH-58', 'นครสวรรค์': 'TH-60', 'อุทัยธานี': 'TH-61', 'กำแพงเพชร': 'TH-62',
            'ตาก': 'TH-63', 'สุโขทัย': 'TH-64', 'พิษณุโลก': 'TH-65', 'พิจิตร': 'TH-66', 'เพชรบูรณ์': 'TH-67',
            'ราชบุรี': 'TH-70', 'กาญจนบุรี': 'TH-71', 'สุพรรณบุรี': 'TH-72', 'นครปฐม': 'TH-73', 'สมุทรสาคร': 'TH-74',
            'สมุทรสงคราม': 'TH-75', 'เพชรบุรี': 'TH-76', 'ประจวบคีรีขันธ์': 'TH-77', 'นครศรีธรรมราช': 'TH-80', 'กระบี่': 'TH-81',
            'พังงา': 'TH-82', 'ภูเก็ต': 'TH-83', 'สุราษฎร์ธานี': 'TH-84', 'ระนอง': 'TH-85', 'ชุมพร': 'TH-86',
            'สงขลา': 'TH-90', 'สตูล': 'TH-91', 'ตรัง': 'TH-92', 'พัทลุง': 'TH-93', 'ปัตตานี': 'TH-94',
            'ยะลา': 'TH-95', 'นราธิวาส': 'TH-96'
        };

        const provincesList = Object.keys(provinceMapping).sort();

        const getRegion = (province) => {
            const code = provinceMapping[province];
            if(!code) return 'อื่นๆ';
            const num = parseInt(code.split('-')[1]);
            if (num >= 10 && num <= 19) return 'ภาคกลาง';
            if (num >= 20 && num <= 27) return 'ภาคตะวันออก';
            if (num >= 30 && num <= 49) return 'ภาคตะวันออกเฉียงเหนือ';
            if (num >= 50 && num <= 67) return 'ภาคเหนือ';
            if (num >= 70 && num <= 77) return 'ภาคตะวันตก';
            if (num >= 80 && num <= 96) return 'ภาคใต้';
            return 'อื่นๆ';
        };

        const formatCurrency = (amount) => new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(amount);

        const generateInitialData = () => {
            let currentTotal = 0;
            const targetTotal = 500000000; // 500 Million
            
            // Step 1: Create raw random data
            const rawData = provincesList.map((province, index) => {
                const cat = mainCategories[Math.floor(Math.random() * mainCategories.length)];
                const typeList = subTypes[cat];
                const type = typeList[Math.floor(Math.random() * typeList.length)];
                
                // Random base budget between 2,000,000 and 15,000,000
                const rawBudget = Math.floor(Math.random() * 13000000) + 2000000;
                currentTotal += rawBudget;

                return {
                    id: index + 1,
                    province: province,
                    coordinator: `อุตสาหกรรมจังหวัด ${province}`,
                    mainCategory: cat,
                    type: type,
                    item: `${type} จังหวัด${province}`,
                    budget: rawBudget,
                    status: 'submitted',
                    date: '2023-10-01'
                };
            });

            // Step 2: Normalize to exactly 500,000,000
            const ratio = targetTotal / currentTotal;
            let finalTotal = 0;

            const normalizedData = rawData.map((req, index) => {
                let adjustedBudget = Math.round(req.budget * ratio);
                
                // Ensure the last item rounds exactly to the target to avoid decimal mismatches
                if (index === rawData.length - 1) {
                    adjustedBudget = targetTotal - finalTotal;
                }
                
                finalTotal += adjustedBudget;
                return { ...req, budget: adjustedBudget };
            });

            return normalizedData.sort((a, b) => b.budget - a.budget); // Sort by budget highest first
        };

        const initialData = generateInitialData();

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [requests, setRequests] = useState(initialData);

            const handleAddRequest = (newRequest) => {
                setRequests([{ ...newRequest, id: Date.now(), status: 'submitted', date: new Date().toISOString().split('T')[0] }, ...requests]);
                setView('list');
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Clean Header / Navbar */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col md:flex-row justify-between h-auto md:h-20 py-4 md:py-0 items-center gap-4">
                                <div className="flex items-center gap-4">
                                    {/* Updated Logo Requirement */}
                                    <div className="p-1 rounded-full border border-slate-200 shadow-sm overflow-hidden bg-white">
                                        <img src="3cba098fefeaaf5f116241adff99b6fb.jpg" 
                                             alt="MOI Logo" 
                                             className="h-12 w-12 object-cover rounded-full" 
                                             onError={(e) => { e.target.src = 'https://upload.wikimedia.org/wikipedia/th/thumb/7/7b/Seal_of_the_Ministry_of_Industry_of_Thailand.svg/120px-Seal_of_the_Ministry_of_Industry_of_Thailand.svg.png'; }} />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-slate-800 tracking-tight">
                                            ระบบจัดทำคำของบประมาณงบลงทุน
                                        </h1>
                                        <p className="text-sm text-slate-500 font-medium">สำนักงานปลัดกระทรวงอุตสาหกรรม (สป.อก.)</p>
                                    </div>
                                </div>
                                <nav className="flex space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                                    <button onClick={() => setView('dashboard')} className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${view === 'dashboard' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}>
                                        <i className="fas fa-chart-pie mr-2"></i>ภาพรวม
                                    </button>
                                    <button onClick={() => setView('form')} className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${view === 'form' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}>
                                        <i className="fas fa-plus-circle mr-2"></i>จัดทำคำขอ
                                    </button>
                                    <button onClick={() => setView('list')} className={`px-5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${view === 'list' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}>
                                        <i className="fas fa-list mr-2"></i>รายการทั้งหมด
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 z-10">
                        {view === 'dashboard' && <Dashboard requests={requests} />}
                        {view === 'form' && <RequestForm onSubmit={handleAddRequest} onCancel={() => setView('list')} />}
                        {view === 'list' && <RequestList requests={requests} />}
                    </main>
                </div>
            );
        };

        const ThailandMap = ({ requests }) => {
            const chartRef = useRef(null);

            useEffect(() => {
                if (!window.google) return;

                const drawChart = () => {
                    const dataTable = new google.visualization.DataTable();
                    dataTable.addColumn('string', 'Province Code');
                    dataTable.addColumn('string', 'Province Name');
                    dataTable.addColumn('number', 'งบประมาณ');
                    dataTable.addColumn({type: 'string', role: 'tooltip', p: {html: true}});

                    const rows = requests.map(req => {
                        const iso = provinceMapping[req.province];
                        if(!iso) return null;
                        
                        const tooltipHtml = `
                            <div style="padding: 10px; font-family: 'Sarabun', sans-serif;">
                                <div style="font-weight: bold; font-size: 14px; color: #1e293b; margin-bottom: 4px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;">จังหวัด${req.province}</div>
                                <div style="color: #475569; font-size: 13px;">งบประมาณรวม</div>
                                <div style="font-weight: bold; color: #9333ea; font-size: 16px;">${formatCurrency(req.budget)}</div>
                                <div style="color: #64748b; font-size: 12px; margin-top: 4px;">ประเภท: ${getCategoryFromType(req.type)}</div>
                            </div>
                        `;
                        return [iso, req.province, req.budget, tooltipHtml];
                    }).filter(Boolean);

                    dataTable.addRows(rows);

                    const options = {
                        region: 'TH',
                        resolution: 'provinces',
                        displayMode: 'regions',
                        colorAxis: {colors: ['#f3e8ff', '#d8b4fe', '#9333ea', '#581c87']}, // Brand light to dark purple
                        backgroundColor: 'transparent',
                        datalessRegionColor: '#f8fafc',
                        defaultColor: '#e2e8f0',
                        tooltip: { isHtml: true, trigger: 'focus' },
                        legend: 'none'
                    };

                    const chart = new google.visualization.GeoChart(chartRef.current);
                    chart.draw(dataTable, options);
                };

                // Load Google Charts if not already loaded, then draw
                if (!google.visualization || !google.visualization.GeoChart) {
                    google.charts.load('current', { 'packages': ['geochart'] });
                    google.charts.setOnLoadCallback(drawChart);
                } else {
                    drawChart();
                }

                const handleResize = () => drawChart();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);

            }, [requests]);

            return (
                <div className="w-full h-full min-h-[400px] flex items-center justify-center relative bg-slate-50/50 rounded-xl">
                    <div ref={chartRef} className="w-full h-full absolute inset-0"></div>
                </div>
            );
        };

        const Dashboard = ({ requests }) => {
            const chartRefPie = useRef(null);
            const chartRefBar = useRef(null);

            const totalBudget = requests.reduce((sum, req) => sum + Number(req.budget), 0);
            
            // Group by Category
            const byCategory = requests.reduce((acc, req) => {
                const cat = getCategoryFromType(req.type);
                acc[cat] = (acc[cat] || 0) + Number(req.budget);
                return acc;
            }, {});

            // Group by Region
            const byRegion = requests.reduce((acc, req) => {
                const region = getRegion(req.province);
                acc[region] = (acc[region] || 0) + Number(req.budget);
                return acc;
            }, {});

            useEffect(() => {
                let pieChart, barChart;
                Chart.defaults.font.family = 'Sarabun';
                Chart.defaults.color = '#64748b';

                if (chartRefPie.current) {
                    const ctxPie = chartRefPie.current.getContext('2d');
                    pieChart = new Chart(ctxPie, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(byCategory),
                            datasets: [{
                                data: Object.values(byCategory),
                                backgroundColor: ['#9333ea', '#3b82f6', '#10b981', '#f59e0b'],
                                borderWidth: 0,
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '70%',
                            plugins: {
                                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } },
                                tooltip: {
                                    backgroundColor: 'rgba(255,255,255,0.95)',
                                    titleColor: '#1e293b',
                                    bodyColor: '#334155',
                                    borderColor: '#e2e8f0',
                                    borderWidth: 1,
                                    padding: 12,
                                    callbacks: { label: (context) => ' ' + formatCurrency(context.raw) }
                                }
                            }
                        }
                    });
                }

                if (chartRefBar.current) {
                    const ctxBar = chartRefBar.current.getContext('2d');
                    barChart = new Chart(ctxBar, {
                        type: 'bar',
                        data: {
                            labels: Object.keys(byRegion),
                            datasets: [{
                                label: 'งบประมาณ (บาท)',
                                data: Object.values(byRegion),
                                backgroundColor: '#a855f7',
                                borderRadius: 6,
                                barPercentage: 0.6
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { border: { display: false }, grid: { color: '#f1f5f9' } },
                                x: { border: { display: false }, grid: { display: false } }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: 'rgba(255,255,255,0.95)',
                                    titleColor: '#1e293b',
                                    bodyColor: '#334155',
                                    borderColor: '#e2e8f0',
                                    borderWidth: 1,
                                    callbacks: { label: (context) => ' ' + formatCurrency(context.raw) }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (pieChart) pieChart.destroy();
                    if (barChart) barChart.destroy();
                };
            }, [requests]);

            return (
                <div className="space-y-6">
                    {/* Top Stats Cards (Taskgo Style) */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white rounded-2xl p-6 card-shadow border border-slate-100 flex flex-col justify-center">
                            <div className="flex items-center gap-4 mb-2">
                                <div className="bg-brand-50 text-brand-600 p-3 rounded-xl">
                                    <i className="fas fa-sack-dollar text-xl"></i>
                                </div>
                                <p className="text-slate-500 font-medium text-sm">มูลค่าคำขอรวมทั้งประเทศ</p>
                            </div>
                            <p className="text-3xl font-bold text-slate-800 font-inter tracking-tight">{formatCurrency(totalBudget)}</p>
                        </div>
                        
                        <div className="bg-white rounded-2xl p-6 card-shadow border border-slate-100 flex flex-col justify-center">
                            <div className="flex items-center gap-4 mb-2">
                                <div className="bg-blue-50 text-blue-600 p-3 rounded-xl">
                                    <i className="fas fa-clipboard-check text-xl"></i>
                                </div>
                                <p className="text-slate-500 font-medium text-sm">จำนวนรายการที่เสนอ</p>
                            </div>
                            <p className="text-3xl font-bold text-slate-800 font-inter tracking-tight">{requests.length} <span className="text-base font-normal text-slate-500 font-sans">รายการ</span></p>
                        </div>

                        <div className="bg-white rounded-2xl p-6 card-shadow border border-slate-100 flex flex-col justify-center">
                            <div className="flex items-center gap-4 mb-2">
                                <div className="bg-emerald-50 text-emerald-600 p-3 rounded-xl">
                                    <i className="fas fa-map-marked-alt text-xl"></i>
                                </div>
                                <p className="text-slate-500 font-medium text-sm">ครอบคลุมพื้นที่</p>
                            </div>
                            <p className="text-3xl font-bold text-slate-800 font-inter tracking-tight">{provincesList.length} <span className="text-base font-normal text-slate-500 font-sans">จังหวัด</span></p>
                        </div>
                    </div>

                    {/* Charts & Map Section */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Interactive Google Map (76 Provinces) */}
                        <div className="bg-white rounded-2xl p-6 card-shadow border border-slate-100 lg:col-span-2 flex flex-col">
                            <div className="flex justify-between items-center mb-6">
                                <div>
                                    <h3 className="font-bold text-lg text-slate-800">แผนที่การกระจายตัวงบประมาณ</h3>
                                    <p className="text-sm text-slate-500">แสดงข้อมูลครบถ้วนทั้ง 76 จังหวัด และกรุงเทพมหานคร</p>
                                </div>
                            </div>
                            <div className="flex-1 min-h-[450px]">
                                <ThailandMap requests={requests} />
                            </div>
                        </div>

                        {/* Side panel for Pie Chart & Top List */}
                        <div className="flex flex-col gap-6">
                            <div className="bg-white rounded-2xl p-6 card-shadow border border-slate-100 h-80 flex flex-col">
                                <h3 className="font-bold text-lg text-slate-800 mb-4">สัดส่วนตามหมวดหมู่</h3>
                                <div className="flex-1 relative">
                                    <canvas ref={chartRefPie}></canvas>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl p-6 card-shadow border border-slate-100 flex-1 flex flex-col">
                                <h3 className="font-bold text-lg text-slate-800 mb-4">ลำดับงบประมาณสูงสุด</h3>
                                <div className="overflow-y-auto flex-1 pr-2 space-y-3">
                                    {requests.slice(0, 5).map((req, index) => (
                                        <div key={req.id} className="flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-100 hover:border-brand-200 transition-colors">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold font-inter ${index === 0 ? 'bg-amber-100 text-amber-600' : index === 1 ? 'bg-slate-200 text-slate-600' : index === 2 ? 'bg-orange-100 text-orange-600' : 'bg-brand-50 text-brand-600'}`}>
                                                    {index + 1}
                                                </div>
                                                <div>
                                                    <div className="font-semibold text-slate-700">{req.province}</div>
                                                    <div className="text-xs text-slate-500">{getCategoryFromType(req.type)}</div>
                                                </div>
                                            </div>
                                            <span className="font-bold font-inter text-slate-800">{new Intl.NumberFormat('th-TH', { notation: 'compact', maximumFractionDigits: 1 }).format(req.budget)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Bar Chart Full Width */}
                    <div className="bg-white rounded-2xl p-6 card-shadow border border-slate-100 h-96 flex flex-col">
                        <h3 className="font-bold text-lg text-slate-800 mb-4">สรุปงบประมาณตามภูมิภาค</h3>
                        <div className="flex-1 relative">
                            <canvas ref={chartRefBar}></canvas>
                        </div>
                    </div>
                </div>
            );
        };

        const RequestForm = ({ onSubmit, onCancel }) => {
            const [formData, setFormData] = useState({
                province: '', coordinator: '', mainCategory: mainCategories[0], type: subTypes[mainCategories[0]][0],
                item: '', details: '', budget: '', reason: ''
            });

            const handleCatChange = (e) => {
                const newCat = e.target.value;
                setFormData({ ...formData, mainCategory: newCat, type: subTypes[newCat][0] });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(formData);
            };

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-2xl card-shadow border border-slate-100 overflow-hidden">
                    <div className="bg-slate-50 border-b border-slate-200 px-8 py-6">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center">
                            <div className="bg-brand-100 text-brand-600 p-2 rounded-lg mr-3">
                                <i className="fas fa-edit"></i>
                            </div>
                            แบบฟอร์มจัดทำคำของบประมาณ
                        </h2>
                        <p className="text-slate-500 text-sm mt-2 ml-11">กรอกข้อมูลโครงการและงบประมาณเพื่อส่งเข้าสู่ระบบส่วนกลาง</p>
                    </div>
                    
                    <form onSubmit={handleSubmit} className="p-8 space-y-8">
                        <div>
                            <h3 className="text-lg font-semibold text-slate-700 mb-4 border-b border-slate-100 pb-2">1. ข้อมูลหน่วยงาน</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-2">จังหวัด <span className="text-red-500">*</span></label>
                                    <select required name="province" value={formData.province} onChange={(e) => setFormData({...formData, province: e.target.value})} className="w-full rounded-xl input-field px-4 py-3">
                                        <option value="">-- เลือกจังหวัด --</option>
                                        {provincesList.map(p => <option key={p} value={p}>{p}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-2">ผู้ประสานงาน <span className="text-red-500">*</span></label>
                                    <input required type="text" value={formData.coordinator} onChange={(e) => setFormData({...formData, coordinator: e.target.value})} placeholder="ชื่อ-สกุล เบอร์โทร" className="w-full rounded-xl input-field px-4 py-3" />
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 className="text-lg font-semibold text-slate-700 mb-4 border-b border-slate-100 pb-2">2. รายละเอียดคำขอ</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-2">หมวดหมู่หลัก <span className="text-red-500">*</span></label>
                                    <select value={formData.mainCategory} onChange={handleCatChange} className="w-full rounded-xl input-field px-4 py-3">
                                        {mainCategories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-2">ประเภทย่อย <span className="text-red-500">*</span></label>
                                    <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})} className="w-full rounded-xl input-field px-4 py-3">
                                        {subTypes[formData.mainCategory].map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                            </div>
                            
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-2">รายการขอตั้งงบ <span className="text-red-500">*</span></label>
                                    <input required type="text" value={formData.item} onChange={(e) => setFormData({...formData, item: e.target.value})} placeholder="เช่น ก่อสร้างอาคารสำนักงานใหม่" className="w-full rounded-xl input-field px-4 py-3" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-2">งบประมาณ (บาท) <span className="text-red-500">*</span></label>
                                    <input required type="number" min="0" value={formData.budget} onChange={(e) => setFormData({...formData, budget: e.target.value})} placeholder="ระบุตัวเลข" className="w-full rounded-xl input-field px-4 py-3 font-inter" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-600 mb-2">เหตุผลความจำเป็น <span className="text-red-500">*</span></label>
                                    <textarea required rows="3" value={formData.reason} onChange={(e) => setFormData({...formData, reason: e.target.value})} placeholder="อธิบายความจำเป็นในการของบประมาณ" className="w-full rounded-xl input-field px-4 py-3"></textarea>
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end gap-4 pt-6 border-t border-slate-100">
                            <button type="button" onClick={onCancel} className="px-6 py-3 rounded-xl font-medium text-slate-600 bg-white border border-slate-300 hover:bg-slate-50 transition-all">ยกเลิก</button>
                            <button type="submit" className="px-6 py-3 rounded-xl font-medium text-white bg-brand-600 hover:bg-brand-700 shadow-md shadow-brand-500/30 transition-all flex items-center">
                                บันทึกและส่งคำขอ <i className="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        const RequestList = ({ requests }) => {
            const [filterRegion, setFilterRegion] = useState('');
            const [filterCat, setFilterCat] = useState('');

            const filtered = requests.filter(r => {
                const matchRegion = filterRegion === '' || getRegion(r.province) === filterRegion;
                const matchCat = filterCat === '' || getCategoryFromType(r.type) === filterCat;
                return matchRegion && matchCat;
            });

            return (
                <div className="bg-white rounded-2xl card-shadow border border-slate-100 flex flex-col h-[calc(100vh-160px)]">
                    <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center">
                            <div className="bg-blue-100 text-blue-600 p-2 rounded-lg mr-3">
                                <i className="fas fa-database"></i>
                            </div>
                            ฐานข้อมูลคำของบประมาณ
                        </h2>
                        <div className="flex gap-3 w-full sm:w-auto">
                            <select value={filterRegion} onChange={e => setFilterRegion(e.target.value)} className="input-field px-4 py-2 rounded-xl text-sm w-full sm:w-40 font-medium">
                                <option value="">ทุกภูมิภาค</option>
                                <option value="ภาคเหนือ">ภาคเหนือ</option>
                                <option value="ภาคกลาง">ภาคกลาง</option>
                                <option value="ภาคตะวันออกเฉียงเหนือ">ภาคอีสาน</option>
                                <option value="ภาคตะวันออก">ภาคตะวันออก</option>
                                <option value="ภาคตะวันตก">ภาคตะวันตก</option>
                                <option value="ภาคใต้">ภาคใต้</option>
                            </select>
                            <select value={filterCat} onChange={e => setFilterCat(e.target.value)} className="input-field px-4 py-2 rounded-xl text-sm w-full sm:w-40 font-medium">
                                <option value="">ทุกหมวดหมู่</option>
                                {mainCategories.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto bg-slate-50/30">
                        <table className="min-w-full text-left border-collapse">
                            <thead className="bg-slate-50 text-slate-500 sticky top-0 z-10 shadow-sm border-b border-slate-200">
                                <tr>
                                    <th className="px-6 py-4 font-semibold text-sm">จังหวัด</th>
                                    <th className="px-6 py-4 font-semibold text-sm">หมวดหมู่</th>
                                    <th className="px-6 py-4 font-semibold text-sm">รายการ</th>
                                    <th className="px-6 py-4 font-semibold text-sm text-right">งบประมาณ (บาท)</th>
                                    <th className="px-6 py-4 font-semibold text-sm text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 bg-white">
                                {filtered.map(req => (
                                    <tr key={req.id} className="hover:bg-slate-50 transition-colors">
                                        <td className="px-6 py-4">
                                            <div className="font-semibold text-slate-800">{req.province}</div>
                                            <div className="text-xs text-slate-500 mt-1">{getRegion(req.province)}</div>
                                        </td>
                                        <td className="px-6 py-4">
                                            <span className="px-3 py-1 rounded-md text-xs font-medium bg-brand-50 text-brand-700 border border-brand-100 inline-block">
                                                {getCategoryFromType(req.type)}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4">
                                            <div className="text-sm text-slate-700">{req.item}</div>
                                        </td>
                                        <td className="px-6 py-4 text-right font-bold text-slate-800 font-inter">
                                            {new Intl.NumberFormat('th-TH').format(req.budget)}
                                        </td>
                                        <td className="px-6 py-4 text-center">
                                            <button className="text-slate-400 hover:text-brand-600 transition-colors mx-1 p-2 rounded-lg hover:bg-brand-50" title="ดูรายละเอียด"><i className="fas fa-eye"></i></button>
                                            <button className="text-slate-400 hover:text-blue-600 transition-colors mx-1 p-2 rounded-lg hover:bg-blue-50" title="เอกสารแนบ"><i className="fas fa-paperclip"></i></button>
                                        </td>
                                    </tr>
                                ))}
                                {filtered.length === 0 && (
                                    <tr>
                                        <td colSpan="5" className="px-6 py-12 text-center text-slate-500">
                                            ไม่พบข้อมูลที่ตรงกับเงื่อนไข
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                    <div className="p-4 bg-white border-t border-slate-100 flex justify-between items-center">
                        <span className="text-slate-500 text-sm">แสดง {filtered.length} รายการ</span>
                        <div>
                            <span className="text-slate-500 mr-3 text-sm">รวมงบประมาณที่แสดง:</span>
                            <span className="text-xl font-bold text-brand-700 font-inter">{formatCurrency(filtered.reduce((s, r) => s + Number(r.budget), 0))}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
