            init(customConfig) {
                const config = customConfig || this.getConfig() || DEFAULT_FIREBASE_CONFIG;
                if (!config || !config.apiKey) {
                    this.isConfigured = false;
                    return false;
                }
                try {
                    if (window.firebase) {
                        if (!firebase.apps.length) {
                            this.app = firebase.initializeApp(config);
                        } else {

                        }

                        }
                        this.isConfigured = true;
                        console.log('Firebase App, Firestore, Storage & Analytics connected successfully to:', config.projectId);

                    console.error('Firebase init error:', e);
                    this.isConfigured = false;
                }
                return false;
            },

            getConfig() {
                try {
                    const isDisconnected = localStorage.getItem('mindbudget_firebase_disconnected');
                    if (isDisconnected === 'true') {
                        return null;
                    }
                    const raw = localStorage.getItem('mindbudget_firebase_config');
                    if (raw) return JSON.parse(raw);
                } catch(e) {}
                return DEFAULT_FIREBASE_CONFIG;
            },

            saveConfig(cfg) {
                try {
                    localStorage.removeItem('mindbudget_firebase_disconnected');
                    localStorage.setItem('mindbudget_firebase_config', JSON.stringify(cfg));
                    return this.init(cfg);
                } catch(e) {
                    return false;

            },

                try {
                    localStorage.removeItem('mindbudget_firebase_disconnected');
                    localStorage.removeItem('mindbudget_firebase_config');
                    return this.init(DEFAULT_FIREBASE_CONFIG);
                } catch(e) {

                                                <td className="p-3.5">
                                                    <p className="font-bold text-slate-800 cursor-pointer hover:text-brand-600" onClick={() => onViewDetails(req)}>

                                                        <div className="bg-red-50 border border-red-200 rounded-lg p-2 mt-2 text-[11px] text-red-700 flex items-start gap-1.5">
                                                            <i className="fas fa-triangle-exclamation text-red-500 mt-0.5 shrink-0"></i>
                                                            <span><strong>ข้อเสนอแนะส่งกลับ:</strong> {req.revisionNote}</span>
                                                        </div>
                                                    )}

                                                <td className="p-3.5 text-right font-bold text-brand-700 font-inter">
                                                    {formatCurrency(req.budget)}
                                                </td>
                                                <td className="p-3.5 text-center">
                                                    {getStatusBadge(req.status)}
                                                </td>
                                                <td className="p-3.5 text-center">
                                                    <button onClick={() => onViewAttachments(req)} className="text-brand-600 hover:text-brand-800 font-bold inline-flex items-center gap-1.5 bg-brand-50 hover:bg-brand-100 px-2.5 py-1 rounded-lg transition border border-brand-200">
                                                        <i className="fas fa-paperclip"></i> {req.attachments ? req.attachments.length : 0} ไฟล์

                                                <td className="p-3.5 text-center">

                                                <td className="p-3.5 text-center">
                                                    <div className="flex flex-wrap justify-center items-center gap-1.5">
                                                        {/* Role 1: Operator Actions */}
                                                        {currentUser.role === 'operator' && (req.status === 'draft' || req.status === 'returned_operator') && (
                                                            <>
                                                                <button 
                                                                    onClick={() => onUpdateStatus(req.id, 'submitted_province', 'ส่งเสนอหัวหน้ากลุ่ม/อุตสาหกรรมจังหวัด')}

                                                                    title="ส่งเสนอหัวหน้ากลุ่ม/อุตสาหกรรมจังหวัด"

                                                                    <i className="fas fa-paper-plane"></i>ส่งเสนอหัวหน้า
                                                                </button>
                                                                <button onClick={() => onDeleteRequest(req.id)} className="p-1.5 text-red-600 hover:bg-red-50 rounded-lg" title="ลบคำขอ">
                                                                    <i className="fas fa-trash"></i>
                                                                </button>
                                                            </>
                                                        )}

                                                        {/* Role 2: Provincial Head Actions */}
                                                        {currentUser.role === 'provincial_head' && req.status === 'submitted_province' && (
                                                            <>
                                                                <button

                                                                    <i className="fas fa-rotate-left"></i>ส่งกลับแก้ไข
                                                                </button>
                                                            </>

                                                            <>
                                                                <button 
                                                                    onClick={() => onUpdateStatus(req.id, 'reviewed', 'ส่วนกลาง สป.อก. กลั่นกรองผ่านเกณฑ์')}

                                                                >
                                                                    <i className="fas fa-clipboard-check"></i>ผ่านตรวจ

                                                                >
                                                                    <i className="fas fa-rotate-left"></i>ส่งคืน สอจ.
                                                                </button>
                                                            </>
                                                        )}

                                                        {/* Role 4: Executive Actions */}
                                                        {currentUser.role === 'executive' && req.status === 'reviewed' && (
                                                            <button 
                                                                onClick={() => onUpdateStatus(req.id, 'approved', 'ผู้บริหารระดับสูงให้ความเห็นชอบและอนุมัติโครงการ')}

                                                                <i className="fas fa-stamp"></i> อนุมัติงบประมาณ

                                                                <i className="fas fa-shield-check"></i> เสร็จสมบูรณ์
                                                            </span>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // Proposal Detail & Audit Trail Modal
        const RequestDetailModal = ({ req, onClose, onOpenAttachments }) => {
            if (!req) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 my-8">
                        <div className="flex justify-between items-center mb-4 border-b pb-3">
                            <div>
                                <span className="text-[10px] font-mono text-slate-400 block">{req.id}</span>
                                <h3 className="text-lg font-bold text-slate-800">{req.item}</h3>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fas fa-times text-lg"></i></button>
                        </div>

                        <div className="space-y-4 text-xs">
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <div>
                                    <span className="text-slate-400 block font-semibold">จังหวัด</span>
                                    <strong className="text-slate-800 text-sm">{req.province}</strong>
                                </div>
                                <div>
                                    <span className="text-slate-400 block font-semibold">วงเงินงบประมาณ</span>
                                    <strong className="text-brand-700 text-sm font-inter">{formatCurrency(req.budget)}</strong>
                                </div>
                                <div>
                                    <span className="text-slate-400 block font-semibold">หมวดหมู่หลัก</span>
                                    <strong className="text-slate-700">{req.mainCategory}</strong>
                                </div>
                                <div>
                                    <span className="text-slate-400 block font-semibold">ประเภทย่อย</span>
                                    <strong className="text-slate-700">{req.type}</strong>
                                </div>
                                <div>
                                    <span className="text-slate-400 block font-semibold">ผู้ประสานงาน</span>
                                    <strong className="text-slate-700">{req.coordinator}</strong>
                                </div>
                                <div>
                                    <span className="text-slate-400 block font-semibold">สถานะปัจจุบัน</span>
                                    <span className="font-bold text-brand-700">{STATUS_CONFIG[req.status]?.label || req.status}</span>
                                </div>
                            </div>

                            {req.reason && (
                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    <span className="font-bold text-slate-700 block mb-1">เหตุผลความจำเป็นและความเร่งด่วน:</span>
                                    <p className="text-slate-600 leading-relaxed">{req.reason}</p>
                                </div>
                            )}

                            {req.revisionNote && (
                                <div className="bg-red-50 p-3 rounded-xl border border-red-200 text-red-800">
                                    <span className="font-bold flex items-center gap-1.5 mb-1">
                                        <i className="fas fa-triangle-exclamation text-red-500"></i> ข้อเสนอแนะส่งกลับแก้ไข:
                                    </span>
                                    <p className="leading-relaxed">{req.revisionNote}</p>
                                </div>
                            )}

                            {/* Attachments Section in Detail */}
                            <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 flex justify-between items-center">
                                <div>
                                    <span className="font-bold text-slate-800 flex items-center gap-1.5">
                                        <i className="fas fa-paperclip text-brand-600"></i> เอกสารแนบในระบบ ({req.attachments ? req.attachments.length : 0} รายการ)
                                    </span>
                                    <p className="text-[11px] text-slate-500 mt-0.5">แบบแปลน, เอกสารราคากลาง และไฟล์ประกอบ</p>
                                </div>
                                <button 
                                    onClick={() => onOpenAttachments(req)}
                                    className="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-bold shadow-sm"
                                >
                                    เปิดดูเอกสารแนบ
                                </button>
                            </div>

                            {/* Audit Trail Timeline */}
                            <div className="pt-3 border-t">
                                <h4 className="font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                                    <i className="fas fa-timeline text-brand-600"></i> บันทึกประวัติและขั้นตอนการดำเนินการ (Audit Trail)
                                </h4>
                                <div className="space-y-3 relative pl-4 border-l-2 border-slate-200 ml-2">
                                    {(req.auditLog || [
                                        { action: 'สร้างร่างคำขอ', by: 'ผู้ปฏิบัติงาน สอจ.', role: 'operator', timestamp: req.date + ' 09:00' }
                                    ]).map((log, index) => (
                                        <div key={index} className="relative">
                                            <div className="absolute -left-[23px] top-1 w-3.5 h-3.5 bg-brand-600 rounded-full border-2 border-white shadow"></div>
                                            <p className="font-bold text-slate-800">{log.action}</p>
                                            <p className="text-[11px] text-slate-500">โดย: {log.by} ({ROLES[Object.keys(ROLES).find(k => ROLES[k].id === log.role)]?.name || log.role}) • {log.timestamp}</p>
                                            {log.note && <p className="text-[11px] text-red-600 italic mt-0.5">"{log.note}"</p>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end pt-5 mt-5 border-t">
                            <button onClick={onClose} className="px-5 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">ปิดหน้าต่าง</button>
                        </div>
                    </div>
                </div>
            );
        };

        // Attachment Viewer & Additional File Uploader Modal
        const AttachmentModal = ({ req, currentUser, onUploadMore, onClose }) => {
            const fileInputRef = useRef(null);
            const [uploading, setUploading] = useState(false);

            if (!req) return null;

            const handleFileSelected = async (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    setUploading(true);
                    try {
                        await onUploadMore(req.id, Array.from(e.target.files));
                    } finally {
                        setUploading(false);
                    }
                }
            };

            const isEditable = currentUser.role === 'operator' && (req.status === 'draft' || req.status === 'returned_operator');

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
                        <div className="flex justify-between items-center mb-4 border-b pb-3">
                            <h3 className="text-base font-bold text-slate-800 flex items-center text-brand-700">
                                <i className="fas fa-paperclip mr-2"></i> เอกสารแนบคำขอ (สอจ. {req.province})
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fas fa-times text-lg"></i></button>
                        </div>

                        <div className="space-y-2.5 mb-5 max-h-72 overflow-y-auto pr-1">
                            {(!req.attachments || req.attachments.length === 0) ? (
                                <p className="text-center text-slate-400 py-6 text-xs">ยังไม่มีเอกสารแนบในคำขอนี้</p>
                            ) : (
                                req.attachments.map((fileItem, idx) => {
                                    const fileName = typeof fileItem === 'string' ? fileItem : fileItem.name;
                                    const fileSize = typeof fileItem === 'object' && fileItem.size ? formatFileSize(fileItem.size) : 'PDF Document';
                                    const fileUrl = typeof fileItem === 'object' ? fileItem.url : '#';

                                    return (
                                        <div key={idx} className="flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-200">
                                            <div className="flex items-center gap-3 min-w-0">
                                                <i className={`${getFileIcon(fileName)} text-xl shrink-0`}></i>
                                                <div className="truncate">
                                                    <span className="text-xs font-semibold text-slate-800 block truncate">{fileName}</span>
                                                    <span className="text-[10px] text-slate-400">{fileSize}</span>
                                                </div>
                                            </div>
                                            
                                            <button 
                                                onClick={() => {
                                                    if (fileUrl && fileUrl !== '#') {
                                                        window.open(fileUrl, '_blank');
                                                    } else {
                                                        alert(`กำลังเปิดไฟล์จำลอง: ${fileName}`);
                                                    }
                                                }}
                                                className="text-xs font-bold text-brand-600 hover:text-brand-800 flex items-center gap-1 px-3 py-1.5 bg-brand-50 hover:bg-brand-100 rounded-lg transition shrink-0"
                                            >
                                                <i className="fas fa-arrow-up-right-from-square"></i> เปิดดู / ดาวน์โหลด
                                            </button>
                                        </div>
                                    );
                                })
                            )}
                        </div>

                        {/* Extra Upload for Operator */}
                        {isEditable && (
                            <div className="mb-4 pt-3 border-t">
                                <input 
                                    type="file" 
                                    ref={fileInputRef} 
                                    onChange={handleFileSelected} 
                                    multiple 
                                    accept=".pdf,.xlsx,.xls,.doc,.docx,.jpg,.jpeg,.png" 
                                    className="hidden" 
                                />
                                <button 
                                    disabled={uploading}
                                    onClick={() => fileInputRef.current?.click()}
                                    className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl border border-slate-300 transition flex items-center justify-center gap-2"
                                >
                                    {uploading ? (
                                        <><i className="fas fa-spinner fa-spin text-brand-600"></i> กำลังอัปโหลดไฟล์ขึ้น Storage...</>
                                    ) : (
                                        <><i className="fas fa-plus text-brand-600"></i> อัปโหลดเอกสารแนบเพิ่มเติม</>
                                    )}
                                </button>
                            </div>
                        )}

                        <div className="flex justify-end pt-2 border-t">
                            <button onClick={onClose} className="px-5 py-2 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600">ปิด</button>
                        </div>
                    </div>
                </div>
            );
        };

        // Return Modal (with reason)
        const ReturnModal = ({ req, targetStatus, onSubmit, onClose }) => {
            const [note, setNote] = useState('');
            if (!req) return null;

            const isToOperator = targetStatus === 'returned_operator';

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
                        <div className="flex justify-between items-center mb-4 border-b pb-3">
                            <h3 className="text-lg font-bold text-amber-600 flex items-center gap-2">
                                <i className="fas fa-rotate-left"></i>
                                {isToOperator ? 'ส่งกลับให้ สอจ. ปรับปรุงแก้ไข' : 'ส่งคืนคำขอให้จังหวัดพิจารณาใหม่'}
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fas fa-times text-lg"></i></button>
                        </div>
                        <p className="text-xs text-slate-600 mb-3">โครงการ: <strong>{req.item}</strong> ({req.province})</p>
                        <form onSubmit={(e) => { e.preventDefault(); onSubmit(req.id, targetStatus, note); }}>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                                ระบุข้อคิดเห็น / สาเหตุที่ส่งกลับแก้ไข <span className="text-red-500">*</span>
                            </label>
                            <textarea 
                                required 
                                rows="4" 
                                value={note} 
                                onChange={(e) => setNote(e.target.value)} 
                                placeholder="เช่น ขอให้ปรับลดประมาณการให้ตรงตามราคากลาง หรือแนบแบบแปลน ปร.4/5 เพิ่มเติม..." 
                                className="w-full input-field rounded-xl p-3 text-xs mb-4"
                            ></textarea>
                            <div className="flex justify-end gap-3">
                                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">ยกเลิก</button>
                                <button type="submit" className="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-amber-600 hover:bg-amber-700 shadow-md">ยืนยันส่งกลับ</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // Firebase Configuration Modal
        const FirebaseConfigModal = ({ isOpen, onClose, onSave, onDisconnect, onSyncAllToFirebase }) => {
            const [jsonInput, setJsonInput] = useState('');
            const [error, setError] = useState(null);

            useEffect(() => {

                                <span className="text-2xl font-extrabold text-white font-inter mt-1 block">76 จังหวัด + สป.อก.</span>

                                    ) : (
                                        filteredUsers.map(usr => {
                                            const roleConf = ROLES[Object.keys(ROLES).find(k => ROLES[k].id === usr.role)] || ROLES.OPERATOR;

                                                            <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs shrink-0 ${usr.role === 'admin' ? 'bg-rose-100 text-rose-700' : 'bg-purple-100 text-purple-700'}`}>

                                                            <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${usr.isActive ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>

                                                            >
                                                                {usr.isActive ? 'จำกัดสิทธิ์ / ระงับ' : 'เปิดสิทธิ์การใช้งาน'}

                                                                title="แก้ไขสิทธิ์ / ย้ายสังกัดจังหวัด"
                                                            >
                                                                <i className="fas fa-user-pen text-brand-600"></i> แก้ไข/ย้ายสิทธิ์
                                                            </button>

                                                            {/* Impersonate / Login As */}
                                                            {usr.uid !== currentUser.uid && (
                                                                <button 
                                                                    disabled={!usr.isActive}
                                                                    onClick={() => onImpersonate(usr)}

                                                                    title="สลับเข้าใช้งานในมุมมองของ User คนนี้"
                                                                >
                                                                    <i className="fas fa-arrow-right-to-bracket"></i> สลับสิทธิ์
                                                                </button>
                                                            )}

                                                            {/* Delete User */}
                                                            {usr.username !== 'admin' && usr.uid !== currentUser.uid && (
                                                                <button 
                                                                    onClick={() => onDeleteUser(usr.uid)}

                                                                    title="ลบผู้ใช้งาน"
                                                                >
                                                                    <i className="fas fa-trash-can"></i>
                                                                </button>

                                                </tr>

                            </table>
                        </div>
                    </div>

                    {/* User Edit / Add Modal */}
                    {isUserModalOpen && (
                        <UserModal 
                            user={editingUser}
                            onSave={handleSave}

                </div>
            );
        };

        // ===============================================================
        // 3. User Add / Edit / Transfer Modal
        // ===============================================================
        const UserModal = ({ user, onSave, onClose }) => {
            const isEdit = Boolean(user && user.uid);
            const [displayName, setDisplayName] = useState(user?.displayName || '');
            const [username, setUsername] = useState(user?.username || '');
            const [email, setEmail] = useState(user?.email || '');
            const [role, setRole] = useState(user?.role || 'operator');
            const [province, setProvince] = useState(user?.province || 'เชียงใหม่');
            const [department, setDepartment] = useState(user?.department || 'กลุ่มนโยบายและแผนงาน');
            const [position, setPosition] = useState(user?.position || 'นักวิเคราะห์นโยบายและแผน');
            const [phone, setPhone] = useState(user?.phone || '');
            const [isActive, setIsActive] = useState(user ? user.isActive : true);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!displayName.trim() || !username.trim()) {
                    alert('กรุณากรอกชื่อ-นามสกุล และชื่อบัญชีผู้ใช้');
                    return;
                }

                onSave({
                    uid: user?.uid || ('user-' + Date.now()),
                    displayName: displayName.trim(),
                    username: username.trim().toLowerCase(),
                    email: email.trim() || `${username.trim().toLowerCase()}@industry.go.th`,
                    role,
                    province: (role === 'central' || role === 'executive' || role === 'admin') ? 'ส่วนกลาง' : province,
                    department: department.trim(),
                    position: position.trim(),
                    phone: phone.trim(),
                    isActive: Boolean(isActive),
                    updatedAt: new Date().toISOString()
                });
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-4 border-b pb-3">
                            <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                <i className={`fas ${isEdit ? 'fa-user-pen text-brand-600' : 'fa-user-plus text-rose-600'}`}></i>
                                {isEdit ? 'แก้ไขสิทธิ์ / ย้ายสังกัดผู้ใช้งาน' : 'เพิ่มผู้ใช้งานใหม่เข้าระบบ'}
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                                <i className="fas fa-times text-lg"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อ-นามสกุล</label>
                                <input 
                                    type="text" 
                                    required
                                    value={displayName}
                                    onChange={(e) => setDisplayName(e.target.value)}
                                    placeholder="เช่น นายสมชาย ปฏิบัติการ"
                                    className="w-full input-field rounded-xl p-2.5 text-xs font-semibold"
                                />
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อบัญชีผู้ใช้ (Username)</label>
                                    <input 
                                        type="text" 
                                        required
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        placeholder="เช่น operator.cm"
                                        className="w-full input-field rounded-xl p-2.5 text-xs font-mono"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">อีเมลราชการ</label>
                                    <input 
                                        type="email" 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="เช่น operator.cm@industry.go.th"
                                        className="w-full input-field rounded-xl p-2.5 text-xs"
                                    />
                                </div>
                            </div>

                            {/* Role Selection (เพิ่ม/ย้ายสิทธิ์) */}
                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">
                                    กำหนดสิทธิ์และบทบาท (Role)
                                </label>
                                <select 
                                    value={role} 
                                    onChange={(e) => setRole(e.target.value)}
                                    className="w-full input-field rounded-xl p-2.5 text-xs font-bold text-purple-900 bg-purple-50/50"
                                >
                                    {Object.values(ROLES).map(r => (
                                        <option key={r.id} value={r.id}>{r.name} — {r.desc.slice(0, 45)}...</option>
                                    ))}
                                </select>
                            </div>

                            {/* Province Selection (ย้ายจังหวัด/สังกัด) */}
                            {(role === 'operator' || role === 'provincial_head') && (
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">
                                        สังกัดจังหวัด (ย้ายพื้นที่รับผิดชอบ)
                                    </label>
                                    <select 
                                        value={province} 
                                        onChange={(e) => setProvince(e.target.value)}
                                        className="w-full input-field rounded-xl p-2.5 text-xs font-semibold"
                                    >
                                        {provincesList.map(p => (
                                            <option key={p} value={p}>สอจ. {p}</option>
                                        ))}
                                    </select>
                                </div>
                            )}

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">กลุ่มงาน / ฝ่าย</label>
                                    <input 
                                        type="text" 
                                        value={department}
                                        onChange={(e) => setDepartment(e.target.value)}
                                        placeholder="เช่น กลุ่มนโยบายและแผนงาน"
                                        className="w-full input-field rounded-xl p-2.5 text-xs"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">ตำแหน่งราชการ</label>
                                    <input 
                                        type="text" 
                                        value={position}
                                        onChange={(e) => setPosition(e.target.value)}
                                        placeholder="เช่น นักวิเคราะห์นโยบายและแผน"
                                        className="w-full input-field rounded-xl p-2.5 text-xs"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
                                <input 
                                    type="text" 
                                    value={phone}
                                    onChange={(e) => setPhone(e.target.value)}
                                    placeholder="เช่น 053-123456"
                                    className="w-full input-field rounded-xl p-2.5 text-xs font-mono"
                                />
                            </div>

                            {/* Active / Inactive Status Switch */}
                            <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                                <div>
                                    <span className="text-xs font-bold text-slate-800 block">สถานะการใช้งานบัญชี (Account Status)</span>
                                    <span className="text-[11px] text-slate-500">
                                        {isActive ? '🟢 เปิดใช้งานตามปกติ (Active)' : '🔴 ระงับสิทธิ์ชั่วคราว (Inactive) ผู้ใช้จะไม่สามารถเข้าสู่ระบบได้'}
                                    </span>
                                </div>
                                <label className="relative inline-flex items-center cursor-pointer">
                                    <input 
                                        type="checkbox" 
                                        checked={isActive}
                                        onChange={(e) => setIsActive(e.target.checked)}
                                        className="sr-only peer"
                                    />
                                    <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                                </label>
                            </div>

                            <div className="pt-3 border-t flex justify-end gap-2">
                                <button 
                                    type="button" 
                                    onClick={onClose}
                                    className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition"
                                >
                                    ยกเลิก
                                </button>
                                <button 
                                    type="submit"
                                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-purple-600 hover:bg-purple-700 shadow-md transition flex items-center gap-1.5"
                                >
                                    <i className="fas fa-floppy-disk"></i> บันทึกข้อมูล
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // ===============================================================
        // 4. In-App Login / Role Switcher Modal
        // ===============================================================
        const LoginModal = ({ 
            isOpen, 
            onClose, 
            users,
            onSelectDemoUser, 
            onFirebaseLogin, 
            onGoogleLogin, 
            onOpenFirebaseConfig 
        }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [authError, setAuthError] = useState('');

            if (!isOpen) return null;

            const handleEmailSubmit = async (e) => {
                e.preventDefault();
                setAuthError('');
                setLoading(true);
                try {
                    await onFirebaseLogin(email, password);
                } catch(err) {
                    setAuthError(err.message || 'เข้าสู่ระบบไม่สำเร็จ');
                } finally {
                    setLoading(false);
                }
            };

            const handleGoogleClick = async () => {
                setAuthError('');
                setLoading(true);
                try {
                    await onGoogleLogin();
                } catch(err) {
                    setAuthError(err.message || 'เข้าสู่ระบบผ่าน Google ไม่สำเร็จ');
                } finally {
                    setLoading(false);
                }
            };

            const userList = users || INITIAL_USERS;

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-7 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center mb-5 border-b pb-3">
                            <div className="flex items-center gap-2.5">
                                <div className="w-10 h-10 rounded-2xl bg-purple-100 text-purple-700 flex items-center justify-center text-lg">
                                    <i className="fas fa-users-gear"></i>
                                </div>
                                <div>

                                    </h3>
                                    <p className="text-[11px] text-slate-400">เลือกระดับสิทธิ์ หรือล็อกอินผ่าน Firebase Auth</p>

                        {/* Quick 5-Role Personas */}
                        <div>
                            <div className="flex items-center gap-2 mb-3">
                                <span className="h-px bg-slate-200 flex-1"></span>
                                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-400">สลับบัญชีผู้ใช้งาน (Active Users)</span>
                                <span className="h-px bg-slate-200 flex-1"></span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                {userList.filter(u => u.isActive).map((usr) => {
                                    const roleConf = ROLES[Object.keys(ROLES).find(k => ROLES[k].id === usr.role)] || ROLES.OPERATOR;
                                    return (

                                            type="button" 
                                            onClick={() => onSelectDemoUser(usr)}
