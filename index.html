                                        >
                                            <div className={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform text-sm ${usr.role === 'admin' ? 'bg-rose-100 text-rose-700' : 'bg-purple-100 text-purple-700'}`}>
                                                <i className={`fas ${roleConf.icon}`}></i>
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-1.5">
                                                    <span className="font-bold text-xs text-slate-800 truncate">{usr.displayName}</span>
                                                </div>
                                                <span className={`inline-block px-1.5 py-0.2 rounded-full text-[9px] font-bold mt-0.5 ${roleConf.badge}`}>
                                                    {roleConf.name}
                                                </span>
                                                <p className="text-[10px] text-slate-400 mt-0.5 truncate">{usr.department}</p>
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Close button */}
                        <div className="mt-6 pt-4 border-t text-center">
                            <button onClick={onClose} className="text-xs text-slate-400 hover:text-slate-600 font-semibold">
                                ปิดหน้าต่างนี้
                            </button>
                        </div>
                    </div>
                </div>
            );
        };


        // ===============================================================
        // 5. MAIN APPLICATION COMPONENT
        // ===============================================================
        const App = () => {
            const [view, setView] = useState('dashboard');
            const [requests, setRequests] = useState(generateInitialData);
            const [assets, setAssets] = useState(initialAssetData);
            
            // All Users in System (Persisted in localStorage & Firestore)
            const [users, setUsers] = useState(() => {
                try {
                    const saved = localStorage.getItem('mindbudget_users_list');
                    return saved ? JSON.parse(saved) : INITIAL_USERS;
                } catch(e) {
                    return INITIAL_USERS;
                }
            });

            // Current User Session (Default is null -> landing page)
            const [currentUser, setCurrentUser] = useState(() => {
                try {
                    const saved = localStorage.getItem('mindbudget_user');
                    return saved ? JSON.parse(saved) : null;
                } catch(e) {
                    return null;
                }
            });

            // Impersonation Tracker for Admin
            const [impersonatingFrom, setImpersonatingFrom] = useState(null);

            // Modals
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
            const [isFirebaseModalOpen, setIsFirebaseModalOpen] = useState(false);
            const [isAssetModalOpen, setIsAssetModalOpen] = useState(false);
            const [editingAsset, setEditingAsset] = useState(null);
            const [selectedReqForReturn, setSelectedReqForReturn] = useState(null);
            const [returnTargetStatus, setReturnTargetStatus] = useState('returned_operator');
            const [inspectingReq, setInspectingReq] = useState(null);
            const [attachmentModalReq, setAttachmentModalReq] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const [isFirebaseConnected, setIsFirebaseConnected] = useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            // Sync users to localStorage
            useEffect(() => {
                try {
                    localStorage.setItem('mindbudget_users_list', JSON.stringify(users));
                } catch(e) {}
            }, [users]);

            // Initialize Firebase if config exists
            useEffect(() => {
                const connected = FirebaseService.init();
                setIsFirebaseConnected(connected);

                if (connected && FirebaseService.auth) {
                    FirebaseService.auth.onAuthStateChanged(async (fbUser) => {
                        if (fbUser) {
                            try {
                                const userDoc = await FirebaseService.db.collection('users').doc(fbUser.uid).get();
                                if (userDoc.exists) {
                                    const data = userDoc.data();
                                    setCurrentUser(data);
                                    localStorage.setItem('mindbudget_user', JSON.stringify(data));
                                }
                            } catch(e) {
                                console.log('Could not fetch user profile:', e);
                            }
                        }
                    });

                    // 1. Sync Requests from Cloud Firestore
                    let unsubReq = () => {};
                    try {
                        unsubReq = FirebaseService.db.collection('requests').onSnapshot(snapshot => {
                            if (!snapshot.empty) {
                                const items = [];
                                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                                setRequests(items);
                            }
                        }, error => {
                            console.warn('Realtime requests sync notice:', error.message);
                        });
                    } catch(e) {
                        console.log('Realtime requests sync error:', e);
                    }

                    // 2. Sync Assets from Cloud Firestore
                    let unsubAssets = () => {};
                    try {
                        unsubAssets = FirebaseService.db.collection('assets').onSnapshot(snapshot => {
                            if (!snapshot.empty) {
                                const items = [];
                                snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                                setAssets(items);
                            }
                        }, error => {
                            console.warn('Realtime assets sync notice:', error.message);
                        });
                    } catch(e) {
                        console.log('Realtime assets sync error:', e);
                    }

                    // 3. Sync Users from Cloud Firestore
                    let unsubUsers = () => {};
                    try {
                        unsubUsers = FirebaseService.db.collection('users').onSnapshot(snapshot => {
                            if (!snapshot.empty) {
                                const items = [];
                                snapshot.forEach(doc => items.push({ uid: doc.id, ...doc.data() }));
                                setUsers(items);
                            }
                        }, error => {
                            console.warn('Realtime users sync notice:', error.message);
                        });
                    } catch(e) {
                        console.log('Realtime users sync error:', e);
                    }

                    return () => {
                        unsubReq();
                        unsubAssets();
                        unsubUsers();
                    };
                }
            }, [isFirebaseConnected]);

            // Login Handlers
            const handleLogin = (usernameOrEmail, password) => {
                const input = (usernameOrEmail || '').trim().toLowerCase();
                
                // Admin login check (ไม่ต้องใส่รหัสผ่าน)
                if (input === 'admin' || input === 'admin@industry.go.th') {
                    const adminUser = users.find(u => u.username === 'admin' || u.role === 'admin') || INITIAL_USERS[0];
                    if (!adminUser.isActive) {
                        return { success: false, message: 'บัญชีผู้ใช้นี้ถูกระงับสิทธิ์การใช้งานชั่วคราว (Inactive) กรุณาติดต่อผู้ดูแลระบบ' };
                    }
                    setCurrentUser(adminUser);
                    localStorage.setItem('mindbudget_user', JSON.stringify(adminUser));
                    showToast('ยินดีต้อนรับ ผู้ดูแลระบบ (Admin) เข้าสู่ระบบ');
                    return { success: true };
                }

                // General User login check
                const found = users.find(u => 
                    (u.username && u.username.toLowerCase() === input) || 
                    (u.email && u.email.toLowerCase() === input)
                );

                if (!found) {
                    return { success: false, message: 'ไม่พบบัญชีผู้ใช้งานนี้ในระบบ กรุณาตรวจสอบชื่อบัญชีหรืออีเมล' };
                }

                if (!found.isActive) {
                    return { success: false, message: 'บัญชีผู้ใช้นี้ถูกระงับสิทธิ์การใช้งานชั่วคราว (Inactive) กรุณาติดต่อผู้ดูแลระบบกลาง' };
                }

                setCurrentUser(found);
                localStorage.setItem('mindbudget_user', JSON.stringify(found));
                showToast(`ยินดีต้อนรับ ${found.displayName} เข้าสู่ระบบ`);
                return { success: true };
            };

            const handleGoogleLogin = async () => {
                if (!FirebaseService.isConfigured || !FirebaseService.auth) {
                    FirebaseService.init();
                }
                if (!FirebaseService.auth) {
                    throw new Error('ระบบยังไม่ได้เชื่อมต่อ Firebase Authentication กรุณาตรวจสอบการตั้งค่า');
                }
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await FirebaseService.auth.signInWithPopup(provider);
                const fbUser = result.user;
                if (fbUser) {
                    const emailLower = (fbUser.email || '').toLowerCase();
                    const matchedUser = users.find(u => u.email && u.email.toLowerCase() === emailLower);
                    const isAdmin = emailLower === 'admin@industry.go.th' || emailLower === 'admin';

                    const userData = matchedUser ? {
                        ...matchedUser,
                        uid: fbUser.uid,
                        displayName: fbUser.displayName || matchedUser.displayName,
                        photoURL: fbUser.photoURL || matchedUser.photoURL,
                        lastLogin: new Date().toLocaleString('th-TH')
                    } : {
                        uid: fbUser.uid,
                        username: fbUser.email ? fbUser.email.split('@')[0] : 'user',
                        email: fbUser.email || '',
                        displayName: fbUser.displayName || fbUser.email || 'ผู้ใช้งาน',
                        role: isAdmin ? 'admin' : 'central',
                        province: 'ส่วนกลาง',
                        department: 'สำนักงานปลัดกระทรวงอุตสาหกรรม (สป.อก.)',
                        position: isAdmin ? 'ผู้ดูแลระบบกลาง' : 'เจ้าหน้าที่ผู้ปฏิบัติงาน',
                        isActive: true,
                        lastLogin: new Date().toLocaleString('th-TH')
                    };

                    setCurrentUser(userData);
                    localStorage.setItem('mindbudget_user', JSON.stringify(userData));

                    if (FirebaseService.db) {
                        FirebaseService.db.collection('users').doc(fbUser.uid).set(userData, { merge: true }).catch(console.warn);
                    }
                    showToast(`ยินดีต้อนรับ ${userData.displayName} เข้าสู่ระบบด้วย Google`);
                    return { success: true };
                }
            };

            const handleLogout = () => {
                if (FirebaseService.auth && FirebaseService.auth.currentUser) {
                    FirebaseService.auth.signOut().catch(console.warn);
                }
                setCurrentUser(null);
                setImpersonatingFrom(null);
                localStorage.removeItem('mindbudget_user');
                showToast('ออกจากระบบเรียบร้อยแล้ว');
            };

            // Impersonation Handlers
            const handleImpersonate = (targetUser) => {
                if (!targetUser.isActive) {
                    alert('ไม่สามารถเข้าใช้งานแทนบัญชีที่ถูกระงับสิทธิ์ (Inactive) ได้');
                    return;
                }
                setImpersonatingFrom(currentUser);
                setCurrentUser(targetUser);
                localStorage.setItem('mindbudget_user', JSON.stringify(targetUser));
                setView('dashboard');
                showToast(`สลับเข้าใช้งานในมุมมองเสมือนของ: ${targetUser.displayName}`);
            };

            const handleStopImpersonate = () => {
                if (impersonatingFrom) {
                    setCurrentUser(impersonatingFrom);
                    localStorage.setItem('mindbudget_user', JSON.stringify(impersonatingFrom));
                    setImpersonatingFrom(null);
                    setView('users');
                    showToast('กลับสู่บัญชีผู้ดูแลระบบ (Admin) เรียบร้อยแล้ว');
                }
            };

            // User Management Operations (Admin)
            const handleAddUser = (userData) => {
                const newUser = {
                    ...userData,
                    uid: userData.uid || ('user-' + Date.now()),
                    isActive: userData.isActive !== undefined ? userData.isActive : true
                };
                setUsers([newUser, ...users]);
                showToast(`เพิ่มผู้ใช้งาน ${newUser.displayName} เรียบร้อยแล้ว`);

                if (FirebaseService.isConfigured && FirebaseService.db) {
                    FirebaseService.db.collection('users').doc(newUser.uid).set(newUser).catch(console.error);
                }
            };

            const handleUpdateUser = (userData) => {
                setUsers(users.map(u => u.uid === userData.uid ? { ...u, ...userData } : u));
                showToast(`ปรับปรุงสิทธิ์ของ ${userData.displayName} เรียบร้อยแล้ว`);

                if (currentUser && currentUser.uid === userData.uid) {
                    setCurrentUser(userData);
                    localStorage.setItem('mindbudget_user', JSON.stringify(userData));
                }

                if (FirebaseService.isConfigured && FirebaseService.db) {
                    FirebaseService.db.collection('users').doc(userData.uid).update(userData).catch(console.error);
                }
            };

            const handleToggleUserStatus = (userId) => {
                setUsers(users.map(u => {
                    if (u.uid === userId) {
                        const nextStatus = !u.isActive;
                        showToast(`สลับสถานะของ ${u.displayName} เป็น: ${nextStatus ? 'ใช้งานอยู่ (Active)' : 'ระงับสิทธิ์ (Inactive)'}`);
                        
                        if (FirebaseService.isConfigured && FirebaseService.db) {
                            FirebaseService.db.collection('users').doc(userId).update({ isActive: nextStatus }).catch(console.error);
                        }
                        return { ...u, isActive: nextStatus };
                    }
                    return u;
                }));
            };

            const handleDeleteUser = (userId) => {
                const target = users.find(u => u.uid === userId);
                if (!target) return;
                if (target.username === 'admin') {
                    alert('ไม่อนุญาตให้ลบบัญชีผู้ดูแลระบบหลัก');
                    return;
                }
                if (window.confirm(`คุณต้องการลบผู้ใช้งาน "${target.displayName}" ออกจากระบบใช่หรือไม่?`)) {
                    setUsers(users.filter(u => u.uid !== userId));
                    showToast(`ลบผู้ใช้งาน ${target.displayName} เรียบร้อยแล้ว`);
                    if (FirebaseService.isConfigured && FirebaseService.db) {
                        FirebaseService.db.collection('users').doc(userId).delete().catch(console.error);
                    }
                }
            };

            // Switch User from in-app modal
            const handleSelectUser = (user) => {
                setCurrentUser(user);
                localStorage.setItem('mindbudget_user', JSON.stringify(user));
                setIsLoginModalOpen(false);
                showToast(`สลับเข้าสู่ระบบ: ${user.displayName}`);
                
                if (user.role !== 'operator' && view === 'form') {
                    setView('dashboard');
                }
            };

            // Firebase Config Handlers
            const handleSaveFirebaseConfig = (cfg) => {
                const ok = FirebaseService.saveConfig(cfg);
                setIsFirebaseConnected(ok);
                setIsFirebaseModalOpen(false);
                if (ok) {
                    showToast('เชื่อมต่อ Firebase Cloud & Storage เรียบร้อยแล้ว!');
                } else {
                    showToast('บันทึกการตั้งค่าแล้ว แต่ไม่สามารถเชื่อมต่อ Firebase ได้');
                }
            };

            const handleDisconnectFirebase = () => {
                FirebaseService.clearConfig();
                setIsFirebaseConnected(false);
                setIsFirebaseModalOpen(false);
                showToast('ยกเลิกการเชื่อมต่อ Firebase และกลับสู่โหมดข้อมูลจำลอง');
            };

            // Request Operations
            const handleAddRequest = async (newRequest) => {
                showToast('กำลังบันทึกคำขอและอัปโหลดเอกสารแนบ...');
                
                const newId = 'REQ-68-' + String(Date.now()).slice(-4);
                let finalAttachments = [];

                if (FirebaseService.isConfigured && FirebaseService.storage && newRequest.files && newRequest.files.length > 0) {
                    try {
                        for (const file of newRequest.files) {
                            const storagePath = `requests/${newId}/${Date.now()}_${file.name}`;
                            const storageRef = FirebaseService.storage.ref(storagePath);
                            const snapshot = await storageRef.put(file);
                            const downloadUrl = await snapshot.ref.getDownloadURL();
                            finalAttachments.push({
                                name: file.name,
                                size: file.size,
                                url: downloadUrl,
                                storagePath: storagePath,
                                uploadedAt: new Date().toISOString()
                            });
                        }
                    } catch(err) {
                        console.error('Storage upload error:', err);
                        showToast('เกิดข้อผิดพลาดในการอัปโหลดไฟล์ขึ้น Storage');
                    }
                } else if (newRequest.files && newRequest.files.length > 0) {
                    finalAttachments = newRequest.files.map(f => ({
                        name: f.name,
                        size: f.size,
                        url: URL.createObjectURL(f),
                        uploadedAt: new Date().toISOString()
                    }));
                } else {
                    finalAttachments = [
                        { name: 'เอกสารขอตั้งงบประมาณ_ปี68.pdf', size: 1450000, url: '#', uploadedAt: '2026-10-01' },
                        { name: 'แบบแปลนราคากลาง_ปร4_5.pdf', size: 3820000, url: '#', uploadedAt: '2026-10-01' }
                    ];
                }

                const reqToAdd = {
                    province: newRequest.province,
                    mainCategory: newRequest.mainCategory,
                    type: newRequest.type,
                    item: newRequest.item,
                    budget: newRequest.budget,
                    reason: newRequest.reason,
                    id: newId,
                    status: 'draft',
                    attachments: finalAttachments,
                    coordinator: currentUser.displayName,
                    date: new Date().toISOString().split('T')[0],
                    auditLog: [
                        { action: 'สร้างร่างคำขอ', by: currentUser.displayName, role: currentUser.role, timestamp: new Date().toLocaleString('th-TH') }
                    ]
                };

                setRequests([reqToAdd, ...requests]);
                setView('list');
                showToast('บันทึกคำขอและอัปโหลดเอกสารแนบเรียบร้อยแล้ว');

                if (FirebaseService.isConfigured && FirebaseService.db) {
                    FirebaseService.db.collection('requests').doc(reqToAdd.id).set(reqToAdd).catch(console.error);
                }
            };

            const handleUploadMoreAttachments = async (requestId, files) => {
                let uploadedItems = [];
                if (FirebaseService.isConfigured && FirebaseService.storage) {
                    for (const file of files) {
                        const storagePath = `requests/${requestId}/${Date.now()}_${file.name}`;
                        const storageRef = FirebaseService.storage.ref(storagePath);
                        const snapshot = await storageRef.put(file);
                        const downloadUrl = await snapshot.ref.getDownloadURL();
                        uploadedItems.push({
                            name: file.name,
                            size: file.size,
                            url: downloadUrl,
                            storagePath: storagePath,
                            uploadedAt: new Date().toISOString()
                        });
                    }
                } else {
                    uploadedItems = files.map(f => ({
                        name: f.name,
                        size: f.size,
                        url: URL.createObjectURL(f),
                        uploadedAt: new Date().toISOString()
                    }));
                }

                setRequests(prev => prev.map(r => {
                    if (r.id === requestId) {
                        const existing = r.attachments || [];
                        const merged = [...existing, ...uploadedItems];
                        if (FirebaseService.isConfigured && FirebaseService.db) {
                            FirebaseService.db.collection('requests').doc(requestId).update({
                                attachments: merged
                            }).catch(console.error);
                        }
                        return { ...r, attachments: merged };
                    }
                    return r;
                }));

                if (attachmentModalReq && attachmentModalReq.id === requestId) {
                    setAttachmentModalReq(prev => ({ ...prev, attachments: [...(prev.attachments || []), ...uploadedItems] }));
                }

                showToast(`อัปโหลดเอกสารแนบเพิ่ม ${files.length} ไฟล์เรียบร้อยแล้ว`);
            };

            const handleUpdateStatus = (id, newStatus, actionTitle = 'ปรับปรุงสถานะ') => {
                setRequests(requests.map(req => {
                    if (req.id === id) {
                        const updatedLog = [
                            ...(req.auditLog || []),
                            { action: actionTitle, by: currentUser.displayName, role: currentUser.role, timestamp: new Date().toLocaleString('th-TH') }
                        ];
                        const updated = { 
                            ...req, 
                            status: newStatus,
                            auditLog: updatedLog,
                            revisionNote: (newStatus === 'reviewed' || newStatus === 'approved') ? '' : req.revisionNote
                        };

                        if (FirebaseService.isConfigured && FirebaseService.db) {
                            FirebaseService.db.collection('requests').doc(id).update({
                                status: newStatus,
                                auditLog: updatedLog
                            }).catch(console.error);
                        }

                        return updated;
                    }
                    return req;
                }));
                showToast(`ดำเนินการ: ${actionTitle} สำเร็จ`);
            };

            const handleReturnRequest = (id, targetStatus, note) => {
                setRequests(requests.map(req => {
                    if (req.id === id) {
                        const actionTitle = targetStatus === 'returned_operator' ? 'หัวหน้า สอจ. ส่งกลับแก้ไข' : 'ส่วนกลาง สป.อก. ส่งคืน';
                        const updatedLog = [
                            ...(req.auditLog || []),
                            { action: actionTitle, by: currentUser.displayName, role: currentUser.role, note, timestamp: new Date().toLocaleString('th-TH') }
                        ];
                        const updated = {
                            ...req,
                            status: targetStatus,
                            revisionNote: note,
                            auditLog: updatedLog
                        };

                        if (FirebaseService.isConfigured && FirebaseService.db) {
                            FirebaseService.db.collection('requests').doc(id).update({
                                status: targetStatus,
                                revisionNote: note,
                                auditLog: updatedLog
                            }).catch(console.error);
                        }

                        return updated;
                    }
                    return req;
                }));
                setSelectedReqForReturn(null);
                showToast('ส่งกลับคำขอเรียบร้อยแล้ว');
            };

            const handleDeleteRequest = (id) => {
                if (window.confirm('คุณต้องการลบคำขอนี้ใช่หรือไม่?')) {
                    setRequests(requests.filter(r => r.id !== id));
                    if (FirebaseService.isConfigured && FirebaseService.db) {
                        FirebaseService.db.collection('requests').doc(id).delete().catch(console.error);
                    }
                    showToast('ลบรายการคำขอเรียบร้อยแล้ว');
                }
            };

            // Asset Handlers (Realtime Firestore Synced)
            const handleSaveAsset = (assetData) => {
                const assetId = assetData.id ? String(assetData.id) : ('AST-' + Date.now());
                const toSave = { ...assetData, id: assetId };
                if (assetData.id) {
                    setAssets(assets.map(a => String(a.id) === String(assetData.id) ? toSave : a));
                    showToast('ปรับปรุงข้อมูลอาคาร/สิ่งปลูกสร้างเรียบร้อยแล้ว');
                } else {
                    setAssets([toSave, ...assets]);
                    showToast('เพิ่มรายการอาคาร/สิ่งปลูกสร้างเรียบร้อยแล้ว');
                }
                if (FirebaseService.isConfigured && FirebaseService.db) {
                    FirebaseService.db.collection('assets').doc(assetId).set(toSave, { merge: true }).catch(console.error);
                }
                setIsAssetModalOpen(false);
                setEditingAsset(null);
            };

            const handleDeleteAsset = (id) => {
                if (window.confirm('คุณต้องการลบรายการอาคาร/สิ่งปลูกสร้างนี้ใช่หรือไม่?')) {
                    const strId = String(id);
                    setAssets(assets.filter(a => String(a.id) !== strId));
                    if (FirebaseService.isConfigured && FirebaseService.db) {
                        FirebaseService.db.collection('assets').doc(strId).delete().catch(console.error);
                    }
                    showToast('ลบรายการเรียบร้อยแล้ว');
                }
            };

            // One-click Batch Database Sync to Cloud Firestore
            const handleSyncAllToFirebase = async () => {
                if (!FirebaseService.isConfigured || !FirebaseService.db) {
                    showToast('ยังไม่ได้เชื่อมต่อ Firebase หรือกำลังเชื่อมต่อ...');
                    return;
                }
                showToast('กำลังนำส่งข้อมูลขึ้น Cloud Firestore...');
                try {
                    const batch = FirebaseService.db.batch();
                    requests.slice(0, 30).forEach(r => {
                        const ref = FirebaseService.db.collection('requests').doc(String(r.id));
                        batch.set(ref, r, { merge: true });
                    });
                    assets.slice(0, 20).forEach(a => {
                        const ref = FirebaseService.db.collection('assets').doc(String(a.id));
                        batch.set(ref, a, { merge: true });
                    });
                    users.forEach(u => {
                        const ref = FirebaseService.db.collection('users').doc(u.uid);
                        batch.set(ref, u, { merge: true });
                    });
                    await batch.commit();
                    showToast('ซิงค์ข้อมูลคำของบประมาณ สินทรัพย์ และผู้ใช้ ขึ้น Cloud Firestore สำเร็จแล้ว!');
                } catch(err) {
                    console.error('Sync all error:', err);
                    showToast('เกิดข้อผิดพลาดในการซิงค์ข้อมูล: ' + err.message);
                }
            };

            // IF NOT LOGGED IN: SHOW DEDICATED FIRST SCREEN (LANDING / LOGIN)
            if (!currentUser) {
                return (
                    <LandingLoginPage 
                        users={users}
                        onLogin={handleLogin}
                        onGoogleLogin={handleGoogleLogin}
                        onOpenFirebaseConfig={() => setIsFirebaseModalOpen(true)}
                        isFirebaseConnected={isFirebaseConnected}
                    />
                );
            }

            const currentRoleConfig = Object.values(ROLES).find(r => r.id === currentUser.role) || ROLES.OPERATOR;

            return (
                <div className="min-h-screen flex flex-col relative font-sans">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-800 text-white text-xs px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 animate-bounce border border-slate-700">
                            <i className="fas fa-circle-check text-emerald-400 text-base"></i>
                            <span className="font-medium">{toastMessage}</span>
                        </div>
                    )}

                    {/* Impersonation Banner for Admin */}
                    {impersonatingFrom && (
                        <div className="bg-amber-400 text-slate-900 px-4 py-2 text-xs font-bold shadow-md flex justify-between items-center z-50">
                            <div className="flex items-center gap-2">
                                <i className="fas fa-triangle-exclamation text-base animate-pulse"></i>
                                <span>กำลังใช้งานในมุมมองเสมือนของ: <strong>{currentUser.displayName}</strong> ({currentRoleConfig.name})</span>
                            </div>
                            <button 
                                onClick={handleStopImpersonate}
                                className="px-3 py-1 bg-slate-900 hover:bg-black text-white text-[11px] rounded-lg shadow font-bold flex items-center gap-1 transition"
                            >
                                <i className="fas fa-arrow-left"></i> สิ้นสุดการจำลอง (กลับสู่ Admin)
                            </button>
                        </div>
                    )}

                    {/* Top Main Navbar */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col md:flex-row justify-between h-auto md:h-20 py-4 md:py-0 items-center gap-4">
                                {/* Branding */}
                                <div className="flex items-center gap-3.5">
                                    <div className="p-1 rounded-full border border-slate-200 shadow-sm overflow-hidden bg-white shrink-0">
                                        <img 
                                            src="3cba098fefeaaf5f116241adff99b6fb.jpg" 
                                            alt="ตรากระทรวงอุตสาหกรรม" 
                                            className="h-12 w-12 object-contain rounded-full"
                                            onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling?.classList.remove('hidden'); }}
                                        />
                                        <div className="hidden shrink-0">
                                            <MoiLogoSvg className="h-12 w-12" />
                                        </div>
                                    </div>
                                    <div>
                                        <h1 className="text-lg sm:text-xl font-extrabold text-slate-800 tracking-tight leading-tight">
                                            ระบบจัดทำคำของบประมาณงบลงทุน
                                        </h1>
                                        <p className="text-xs text-slate-500 font-medium">สำนักงานปลัดกระทรวงอุตสาหกรรม (สป.อก.)</p>
                                    </div>
                                </div>

                                {/* Right Controls */}
                                <div className="flex flex-wrap items-center gap-3">
                                    {/* Cloud Status Pill */}
                                    <button 
                                        onClick={() => setIsFirebaseModalOpen(true)}
                                        className={`px-3 py-1.5 rounded-xl text-[11px] font-bold border transition flex items-center gap-1.5 ${isFirebaseConnected ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 'bg-amber-50 text-amber-700 border-amber-300'}`}
                                        title="คลิกเพื่อตั้งค่าการเชื่อมต่อ Firebase"
                                    >
                                        <span className={`w-2 h-2 rounded-full ${isFirebaseConnected ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                                        {isFirebaseConnected ? 'Firebase Realtime: เชื่อมต่อแล้ว' : 'Demo Mode (คลิกเพื่อต่อ Firebase)'}
                                    </button>

                                    {/* User Role Card & Buttons */}
                                    <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-2xl border border-slate-200">
                                        <div className="px-3 py-1 flex items-center gap-2">
                                            <div className={`w-8 h-8 rounded-full text-white flex items-center justify-center font-bold text-xs ${currentUser.role === 'admin' ? 'bg-rose-600' : 'bg-purple-600'}`}>
                                                <i className={`fas ${currentRoleConfig.icon}`}></i>
                                            </div>
                                            <div className="text-left">
                                                <p className="text-xs font-bold text-slate-800 leading-tight">{currentUser.displayName}</p>
                                                <span className="text-[10px] text-slate-500 font-medium block">
                                                    {currentUser.province === 'ส่วนกลาง' ? 'ส่วนกลาง' : `สอจ. ${currentUser.province}`}
                                                </span>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={() => setIsLoginModalOpen(true)} 
                                            className="px-2.5 py-1.5 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs rounded-xl border border-slate-200 shadow-sm transition flex items-center gap-1"
                                            title="สลับสิทธิ์การใช้งาน"
                                        >
                                            <i className="fas fa-users-gear text-brand-600"></i> สลับสิทธิ์
                                        </button>

                                        <button 
                                            onClick={handleLogout} 
                                            className="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold text-xs rounded-xl border border-rose-200 shadow-sm transition flex items-center gap-1"
                                            title="ออกจากระบบ"
                                        >
                                            <i className="fas fa-right-from-bracket"></i> ออกจากระบบ
                                        </button>
                                    </div>

                                    {/* Navigation Menu Tabs */}
                                    <nav className="flex space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                                        <button 
                                            onClick={() => setView('dashboard')} 
                                            className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${view === 'dashboard' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}
                                        >
                                            <i className="fas fa-chart-pie mr-1.5"></i>
                                            {currentUser.role === 'executive' ? 'มุมมองผู้บริหาร' : 'ภาพรวม'}
                                        </button>

                                        <button 
                                            onClick={() => setView('list')} 
                                            className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${view === 'list' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}
                                        >
                                            <i className="fas fa-list-check mr-1.5"></i>รายการคำขอ
                                        </button>

                                        <button 
                                            onClick={() => setView('assets')} 
                                            className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${view === 'assets' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}
                                        >
                                            <i className="fas fa-building-user mr-1.5"></i>สถานะงบลงทุน
                                        </button>

                                        {currentUser.role === 'operator' && (
                                            <button 
                                                onClick={() => setView('form')} 
                                                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${view === 'form' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}
                                            >
                                                <i className="fas fa-plus-circle mr-1.5"></i>ยื่นคำขอใหม่
                                            </button>
                                        )}

                                        {/* Admin User Management Tab */}
                                        {currentUser.role === 'admin' && (
                                            <button 
                                                onClick={() => setView('users')} 
                                                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${view === 'users' ? 'bg-white shadow border border-slate-200 text-rose-700' : 'text-rose-600 hover:bg-rose-100/60'}`}
                                            >
                                                <i className="fas fa-users-gear mr-1.5 text-rose-600"></i>จัดการผู้ใช้งาน
                                            </button>
                                        )}
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Active Role & Scope Banner */}
                    <div className="bg-gradient-to-r from-purple-950 via-brand-900 to-indigo-950 text-white px-4 py-2 text-xs shadow-inner">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
                            <div className="flex items-center gap-2">
                                <span className="bg-white/20 px-2 py-0.5 rounded-full uppercase tracking-wider font-extrabold text-[9px]">
                                    {currentUser.role === 'admin' ? 'ผู้ดูแลระบบสูงสุด' : `สิทธิ์ระดับชั้นที่ ${currentUser.role === 'operator' ? '1' : currentUser.role === 'provincial_head' ? '2' : currentUser.role === 'central' ? '3' : '4'}`}
                                </span>
                                <span className="font-bold text-yellow-300 flex items-center gap-1.5">
                                    <i className={`fas ${currentRoleConfig.icon}`}></i>
                                    {currentRoleConfig.name}
                                </span>
                                <span className="text-purple-200">|</span>
                                <span className="text-slate-200">
                                    พื้นที่รับผิดชอบ: <strong className="text-white underline">{currentUser.province === 'ส่วนกลาง' ? 'ทุกจังหวัดทั่วประเทศ' : `สอจ. ${currentUser.province}`}</strong>
                                </span>
                            </div>
                            <div className="text-purple-200 text-[11px] italic">
                                {currentRoleConfig.desc}
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 z-10">
                        {view === 'dashboard' && (
                            <Dashboard 
                                requests={requests} 
                                currentUser={currentUser} 
                                onApproveAll={() => {
                                    setRequests(requests.map(r => r.status === 'reviewed' ? {
                                        ...r, 
                                        status: 'approved',
                                        auditLog: [...(r.auditLog || []), { action: 'ผู้บริหารอนุมัติงบประมาณรวดเดียว', by: currentUser.displayName, role: currentUser.role, timestamp: new Date().toLocaleString('th-TH') }]
                                    } : r));
                                    showToast('อนุมัติโครงการทั้งหมดที่ผ่านการกลั่นกรองเรียบร้อยแล้ว');
                                }} 
                            />
                        )}

                        {view === 'list' && (
                            <RequestList 
                                requests={requests} 
                                currentUser={currentUser} 
                                onUpdateStatus={handleUpdateStatus}
                                onRequestReturn={(req, targetStatus) => {
                                    setSelectedReqForReturn(req);
                                    setReturnTargetStatus(targetStatus);
                                }}
                                onViewAttachments={(req) => setAttachmentModalReq(req)}
                                onViewDetails={(req) => setInspectingReq(req)}
                                onDeleteRequest={handleDeleteRequest}
                            />
                        )}

                        {view === 'assets' && (
                            <AssetStatusView 
                                assets={assets} 
                                currentUser={currentUser} 
                                onAddNew={() => { setEditingAsset(null); setIsAssetModalOpen(true); }}
                                onEdit={(item) => { setEditingAsset(item); setIsAssetModalOpen(true); }}
                                onDelete={handleDeleteAsset}
                            />
                        )}

                        {view === 'form' && currentUser.role === 'operator' && (
                            <RequestForm 
                                onSubmit={handleAddRequest} 
                                onCancel={() => setView('list')}
                                currentUser={currentUser}
                            />
                        )}

                        {/* User Management View (Item 2) */}
                        {view === 'users' && currentUser.role === 'admin' && (
                            <UserManagement 
                                users={users}
                                currentUser={currentUser}
                                onAddUser={handleAddUser}
                                onUpdateUser={handleUpdateUser}
                                onToggleUserStatus={handleToggleUserStatus}
                                onDeleteUser={handleDeleteUser}
                                onImpersonate={handleImpersonate}
                            />
                        )}
                    </main>

                    {/* Modals */}
                    <LoginModal 
                        isOpen={isLoginModalOpen} 
                        onClose={() => setIsLoginModalOpen(false)} 
                        users={users}
                        onSelectDemoUser={handleSelectUser}
                        onFirebaseLogin={async (email, pass) => {
                            if (FirebaseService.auth) {
                                await FirebaseService.auth.signInWithEmailAndPassword(email, pass);
                                setIsLoginModalOpen(false);
                            } else {
                                throw new Error('กรุณาตั้งค่าเชื่อมต่อ Firebase Project ก่อนใช้งาน');
                            }
                        }}
                        onGoogleLogin={async () => {
                            await handleGoogleLogin();
                            setIsLoginModalOpen(false);
                        }}
                        onOpenFirebaseConfig={() => {
                            setIsLoginModalOpen(false);
                            setIsFirebaseModalOpen(true);
                        }}
                    />

                    {isAssetModalOpen && (
                        <AssetFormModal 
                            asset={editingAsset}
                            currentUser={currentUser}
                            onSave={handleSaveAsset}
                            onClose={() => { setIsAssetModalOpen(false); setEditingAsset(null); }}
                        />
                    )}

                    {inspectingReq && (
                        <RequestDetailModal 
                            req={inspectingReq}
                            onClose={() => setInspectingReq(null)}
                            onOpenAttachments={(r) => {
                                setInspectingReq(null);
                                setAttachmentModalReq(r);
                            }}
                        />
                    )}

                    {attachmentModalReq && (
                        <AttachmentModal 
                            req={attachmentModalReq}
                            currentUser={currentUser}
                            onUploadMore={handleUploadMoreAttachments}
                            onClose={() => setAttachmentModalReq(null)}
                        />
                    )}

                    {selectedReqForReturn && (
                        <ReturnModal 
                            req={selectedReqForReturn}
                            targetStatus={returnTargetStatus}
                            onSubmit={(id, status, note) => handleReturnRequest(id, status, note)}
                            onClose={() => setSelectedReqForReturn(null)}
                        />
                    )}

                    <FirebaseConfigModal 
                        isOpen={isFirebaseModalOpen}
                        onClose={() => setIsFirebaseModalOpen(false)}
                        onSave={handleSaveFirebaseConfig}
                        onDisconnect={handleDisconnectFirebase}
                        onSyncAllToFirebase={handleSyncAllToFirebase}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
