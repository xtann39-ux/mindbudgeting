            const [assets, setAssets] = useState(initialAssetData);
            const [editingAsset, setEditingAsset] = useState(null);
            const [isAssetModalOpen, setIsAssetModalOpen] = useState(false);
            const [currentRole, setCurrentRole] = useState(ROLES.OPERATOR.id);
            const [userProvince, setUserProvince] = useState('เชียงใหม่');
            const [selectedRequestForReturn, setSelectedRequestForReturn] = useState(null);
            const [returnNote, setReturnNote] = useState('');
            const [attachmentModalReq, setAttachmentModalReq] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const handleSaveAsset = (assetData) => {
                if (assetData.id) {
                    setAssets(assets.map(a => a.id === assetData.id ? assetData : a));
                    showToast('ปรับปรุงข้อมูลอาคาร/สิ่งปลูกสร้างเรียบร้อยแล้ว');
                } else {
                    const newEntry = { ...assetData, id: Date.now() };
                    setAssets([newEntry, ...assets]);
                    showToast('เพิ่มรายการอาคาร/สิ่งปลูกสร้างเรียบร้อยแล้ว');
                }
                setIsAssetModalOpen(false);
                setEditingAsset(null);
            };

            const handleDeleteAsset = (id) => {
                if (window.confirm('คุณต้องการลบรายการอาคาร/สิ่งปลูกสร้างนี้ใช่หรือไม่?')) {
                    setAssets(assets.filter(a => a.id !== id));
                    showToast('ลบรายการเรียบร้อยแล้ว');
                }
            };

            const handleAddRequest = (newRequest) => {
                const reqToAdd = {
                    ...newRequest,
                    id: Date.now(),
                    province: currentRole === ROLES.OPERATOR.id ? userProvince : newRequest.province,
                    status: 'submitted',
                    attachments: newRequest.attachments || ['เอกสารแนบคำขอ.pdf'],
                    date: new Date().toISOString().split('T')[0]
                };
                setRequests([reqToAdd, ...requests]);
                setView('list');
                showToast('ยื่นคำขอบันทึกเรียบร้อยแล้ว');
            };

            const handleUpdateStatus = (id, newStatus, note = '') => {
                setRequests(requests.map(req => {
                    if (req.id === id) {
                        return { ...req, status: newStatus, revisionNote: note || req.revisionNote };
                    }
                    return req;
                }));
                showToast('อัปเดตสถานะคำขอเรียบร้อยแล้ว');
            };

            const handleReturnSubmit = (e) => {
                e.preventDefault();
                if (selectedRequestForReturn) {
                    handleUpdateStatus(selectedRequestForReturn.id, 'returned', returnNote);
                    setSelectedRequestForReturn(null);
                    setReturnNote('');
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Toast Alert Banner */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-800 text-white text-xs px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 animate-bounce">
                            <i className="fas fa-check-circle text-emerald-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col md:flex-row justify-between h-auto md:h-20 py-4 md:py-0 items-center gap-4">
                                <div className="flex items-center gap-4">
                                    <div className="p-1 rounded-full border border-slate-200 shadow-sm overflow-hidden bg-white">
                                        <img src="https://github.com/xtann39-ux/mindbudgeting/blob/main/3cba098fefeaaf5f116241adff99b6fb.jpg" 
                                             alt="MOI Logo" 
                                             className="h-12 w-12 object-cover rounded-full" 
                                             onError={(e) => { e.target.src = 'https://github.com/xtann39-ux/mindbudgeting/blob/main/3cba098fefeaaf5f116241adff99b6fb.jpg'; }} />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold text-slate-800 tracking-tight">
                                            ระบบจัดทำคำของบประมาณงบลงทุน
                                        </h1>
                                        <p className="text-sm text-slate-500 font-medium">สำนักงานปลัดกระทรวงอุตสาหกรรม (สป.อก.)</p>
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center gap-3">
                                    <div className="bg-slate-100 p-1.5 rounded-2xl border border-slate-200 flex items-center gap-2">
                                        <span className="text-xs font-bold text-slate-500 px-2 flex items-center gap-1">
                                            <i className="fas fa-shield-halved text-brand-600"></i> สิทธิ์:
                                        </span>
                                        <select 
                                            value={currentRole} 
                                            onChange={(e) => setCurrentRole(e.target.value)}
                                            className="bg-white border border-slate-300 font-semibold text-xs rounded-xl px-3 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                        >
                                            <option value={ROLES.OPERATOR.id}>1. ระดับปฏิบัติการ (สอจ.)</option>
                                            <option value={ROLES.CENTRAL.id}>2. ส่วนกลาง / กลุ่มงานงบฯ</option>
                                            <option value={ROLES.EXECUTIVE.id}>3. ผู้บริหารระดับสูง</option>
                                        </select>

                                        {currentRole === ROLES.OPERATOR.id && (
                                            <select 
                                                value={userProvince} 
                                                onChange={(e) => setUserProvince(e.target.value)}
                                                className="bg-emerald-50 border border-emerald-300 font-bold text-xs rounded-xl px-2.5 py-1.5 text-emerald-800 focus:outline-none"
                                            >
                                                {provincesList.map(p => <option key={p} value={p}>สอจ. {p}</option>)}
                                            </select>
                                        )}
                                    </div>

                                    <nav className="flex space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                                        <button onClick={() => setView('dashboard')} className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 ${view === 'dashboard' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}>
                                            <i className="fas fa-chart-pie mr-1.5"></i>
                                            {currentRole === ROLES.EXECUTIVE.id ? 'มุมมองผู้บริหาร' : 'ภาพรวม'}
                                        </button>
                                        
                                        {}
                                        <button onClick={() => setView('assets')} className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 ${view === 'assets' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}>
                                            <i className="fas fa-building-user mr-1.5"></i>สถานะงบลงทุน
                                        </button>

                                        {currentRole === ROLES.OPERATOR.id && (
                                            <button onClick={() => setView('form')} className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 ${view === 'form' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}>
                                                <i className="fas fa-plus-circle mr-1.5"></i>ยื่นคำขอใหม่
                                            </button>
                                        )}
                                        <button onClick={() => setView('list')} className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all duration-200 ${view === 'list' ? 'bg-white shadow border border-slate-200 text-brand-700' : 'text-slate-600 hover:bg-slate-200'}`}>
                                            <i className="fas fa-list mr-1.5"></i>รายการคำขอ
                                        </button>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Active Role Info Banner */}
                    <div className="bg-gradient-to-r from-purple-900 via-brand-700 to-indigo-900 text-white px-4 py-2.5 text-xs font-medium shadow-inner">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
                            <div className="flex items-center gap-2">
                                <span className="bg-white/20 px-2.5 py-0.5 rounded-full uppercase tracking-wider font-bold text-[10px]">
                                    Active Access Role
                                </span>
                                <span className="font-semibold text-yellow-300 flex items-center gap-1.5">
                                    <i className={`fas ${ROLES[Object.keys(ROLES).find(k => ROLES[k].id === currentRole)].icon}`}></i>
                                    {ROLES[Object.keys(ROLES).find(k => ROLES[k].id === currentRole)].name}
                                </span>
                                {currentRole === ROLES.OPERATOR.id && (
                                    <span className="text-slate-200">| สิทธิ์จัดการเฉพาะพื้นที่: <strong className="text-white underline">สอจ. {userProvince}</strong></span>
                                )}
                            </div>
                            <div className="text-purple-200 text-[11px] italic">
                                {currentRole === ROLES.OPERATOR.id && '✓ สิทธิ์: สร้างคำขอ, แก้ไขเฉพาะของ สอจ. ตนเอง, แนบเอกสารประกอบ'}
                                {currentRole === ROLES.CENTRAL.id && '✓ สิทธิ์: ตรวจสอบข้อมูลคำขอทั้ง 76 จังหวัด, ส่งกลับแก้ไข, สรุปเสนอผู้บริหาร'}
                                {currentRole === ROLES.EXECUTIVE.id && '✓ สิทธิ์: ดูภาพรวมเชิงนโยบาย, วิเคราะห์งบประมาณ, พิจารณาอนุมัติ'}
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 z-10">
                        {view === 'dashboard' && <Dashboard requests={requests} currentRole={currentRole} userProvince={userProvince} onApproveAll={() => {
                            setRequests(requests.map(r => r.status === 'reviewed' ? {...r, status: 'approved'} : r));
                            showToast('อนุมัติคำขอทั้งหมดที่ผ่านการกลั่นกรองเรียบร้อยแล้ว');
                        }} />}
                        
                        {}
                        {view === 'assets' && (
                            <AssetStatusView 
                                assets={assets} 
                                currentRole={currentRole} 
                                userProvince={userProvince}
                                onAddNew={() => { setEditingAsset(null); setIsAssetModalOpen(true); }}
                                onEdit={(item) => { setEditingAsset(item); setIsAssetModalOpen(true); }}
                                onDelete={handleDeleteAsset}
                            />
                        )}

                        {view === 'form' && <RequestForm onSubmit={handleAddRequest} onCancel={() => setView('list')} userProvince={userProvince} />}
                        {view === 'list' && (
                            <RequestList 
                                requests={requests} 
                                currentRole={currentRole} 
                                userProvince={userProvince}
                                onUpdateStatus={handleUpdateStatus}
                                onRequestReturn={(req) => setSelectedRequestForReturn(req)}
                                onViewAttachments={(req) => setAttachmentModalReq(req)}
                            />
                        )}
                    </main>

                    {}
                    {isAssetModalOpen && (
                        <AssetFormModal 
                            asset={editingAsset}
                            userProvince={userProvince}
                            currentRole={currentRole}
                            onSave={handleSaveAsset}
                            onClose={() => { setIsAssetModalOpen(false); setEditingAsset(null); }}
                        />
                    )}

                    {/* Return Request Note Modal */}
                    {selectedRequestForReturn && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-fade-in">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center text-amber-600">
                                        <i className="fas fa-rotate-left mr-2"></i> คืนคำขอให้ สอจ. แก้ไข
                                    </h3>
                                    <button onClick={() => setSelectedRequestForReturn(null)} className="text-slate-400 hover:text-slate-600"><i className="fas fa-times text-lg"></i></button>
                                </div>
                                <p className="text-sm text-slate-600 mb-2">โครงการ: <strong>{selectedRequestForReturn.item}</strong> (สอจ. {selectedRequestForReturn.province})</p>
                                <form onSubmit={handleReturnSubmit}>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">ข้อเสนอแนะ / สาเหตุที่ส่งกลับแก้ไข <span className="text-red-500">*</span></label>
                                    <textarea 
                                        required 
                                        rows="4" 
                                        value={returnNote} 
                                        onChange={(e) => setReturnNote(e.target.value)} 
                                        placeholder="ระบุข้อผิดพลาดหรือสิ่งที่ต้องให้ สอจ. ปรับปรุงแก้ไข..." 
                                        className="w-full input-field rounded-xl p-3 text-sm mb-4"
                                    ></textarea>
                                    <div className="flex justify-end gap-3">
                                        <button type="button" onClick={() => setSelectedRequestForReturn(null)} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">ยกเลิก</button>
                                        <button type="submit" className="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-amber-600 hover:bg-amber-700 shadow-md">ยืนยันการคืนคำขอ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Attachments Modal */}
                    {attachmentModalReq && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
                                <div className="flex justify-between items-center mb-4 border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center text-brand-700">
                                        <i className="fas fa-paperclip mr-2"></i> เอกสารแนบคำขอ (สอจ. {attachmentModalReq.province})
                                    </h3>
                                    <button onClick={() => setAttachmentModalReq(null)} className="text-slate-400 hover:text-slate-600"><i className="fas fa-times text-lg"></i></button>
                                </div>
                                <div className="space-y-3 mb-6">
                                    {attachmentModalReq.attachments.map((file, idx) => (
                                        <div key={idx} className="flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-200">
                                            <div className="flex items-center gap-3">
                                                <i className="fas fa-file-pdf text-red-500 text-xl"></i>
                                                <span className="text-sm font-medium text-slate-700">{file}</span>
                                            </div>
                                            <button onClick={() => showToast(`เริ่มการดาวน์โหลด: ${file}`)} className="text-xs font-semibold text-brand-600 hover:underline flex items-center gap-1">
                                                <i className="fas fa-download"></i> ดาวน์โหลด
                                            </button>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex justify-end">
                                    <button onClick={() => setAttachmentModalReq(null)} className="px-5 py-2 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">ปิด</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Dashboard = ({ requests, currentRole, userProvince, onApproveAll }) => {
            const chartRefPie = useRef(null);
            const chartRefBar = useRef(null);

            const displayRequests = currentRole === ROLES.OPERATOR.id 
                ? requests.filter(r => r.province === userProvince) 
                : requests;

            const totalBudget = displayRequests.reduce((sum, req) => sum + Number(req.budget), 0);
            
            const statusCounts = {
                submitted: displayRequests.filter(r => r.status === 'submitted').length,
                returned: displayRequests.filter(r => r.status === 'returned').length,
                reviewed: displayRequests.filter(r => r.status === 'reviewed').length,
                approved: displayRequests.filter(r => r.status === 'approved').length,
            };

            useEffect(() => {
                let pieInstance = null;
                let barInstance = null;

                if (chartRefPie.current) {
                    const ctxPie = chartRefPie.current.getContext('2d');
                    if (chartRefPie.current._chartInstance) {
                        chartRefPie.current._chartInstance.destroy();
                    }

                    const catMap = {};
                    displayRequests.forEach(r => {
                        const cat = getCategoryFromType(r.type);
                        catMap[cat] = (catMap[cat] || 0) + Number(r.budget);
                    });

                    pieInstance = new Chart(ctxPie, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(catMap),
                            datasets: [{
                                data: Object.values(catMap),
                                backgroundColor: ['#9333ea', '#3b82f6', '#10b981', '#f59e0b', '#64748b']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'bottom', labels: { font: { family: 'Sarabun', size: 11 } } }
                            }
                        }
                    });
                    chartRefPie.current._chartInstance = pieInstance;
                }

                if (chartRefBar.current) {
                    const ctxBar = chartRefBar.current.getContext('2d');
                    if (chartRefBar.current._chartInstance) {
                        chartRefBar.current._chartInstance.destroy();
                    }

                    const provMap = {};
                    displayRequests.forEach(r => {
                        provMap[r.province] = (provMap[r.province] || 0) + Number(r.budget);
                    });
                    const topProvinces = Object.entries(provMap).sort((a, b) => b[1] - a[1]).slice(0, 6);

                    barInstance = new Chart(ctxBar, {
                        type: 'bar',
                        data: {
                            labels: topProvinces.map(p => p[0]),
                            datasets: [{
                                label: 'งบประมาณ (บาท)',
                                data: topProvinces.map(p => p[1]),
                                backgroundColor: '#7e22ce',
                                borderRadius: 8
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: { ticks: { font: { family: 'Sarabun', size: 10 } } },
                                x: { ticks: { font: { family: 'Sarabun', size: 11 } } }
                            }
                        }
                    });
                    chartRefBar.current._chartInstance = barInstance;
                }

                return () => {
                    if (pieInstance) pieInstance.destroy();
                    if (barInstance) barInstance.destroy();
                };
            }, [displayRequests]);

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* Header Summary Banner */}
                    <div className="bg-gradient-to-r from-brand-900 via-brand-700 to-indigo-900 text-white rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div className="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md text-purple-200 border border-white/20 px-3 py-1 rounded-full text-xs font-semibold mb-2">
                                <i className="fas fa-chart-line text-yellow-300"></i> Executive Overview
                            </div>
                            <h2 className="text-2xl font-bold tracking-tight">
                                {currentRole === ROLES.EXECUTIVE.id ? 'สรุปภาพรวมงบประมาณรายจังหวัด' : 'ภาพรวมระบบจัดทำคำของบประมาณ'}
                            </h2>
                            <p className="text-purple-200 text-xs mt-1">
                                {currentRole === ROLES.OPERATOR.id 
                                    ? `แสดงสถิติคำขอสำหรับ สำนักงานอุตสาหกรรมจังหวัด${userProvince}` 
                                    : 'ภาพรวมคำขอจัดตั้งงบลงทุนทั่วประเทศ 76 จังหวัด + ส่วนกลาง'}
                            </p>
                        </div>

                        {currentRole === ROLES.EXECUTIVE.id && statusCounts.reviewed > 0 && (
                            <button 
                                onClick={onApproveAll}
                                className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg hover:shadow-emerald-500/30 transition-all text-xs flex items-center gap-2"
                            >
                                <i className="fas fa-check-double text-sm"></i> อนุมัติคำขอที่ผ่านกลั่นกรองทั้งหมด ({statusCounts.reviewed})
                            </button>
                        )}
                    </div>

                    {/* KPI Stat Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white rounded-2xl p-5 card-shadow border border-slate-100 flex items-center justify-between">
                            <div>
                                <p className="text-slate-500 text-xs font-semibold">งบประมาณรวมที่เสนอขอ</p>
                                <p className="text-xl font-bold text-slate-800 font-inter mt-1">{formatCurrency(totalBudget)}</p>
                                <p className="text-[11px] text-slate-400 mt-1"><i className="fas fa-list-check mr-1"></i>{displayRequests.length} รายการคำขอ</p>
                            </div>
                            <div className="w-12 h-12 rounded-2xl bg-purple-50 text-brand-600 flex items-center justify-center text-xl">
                                <i className="fas fa-vault"></i>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl p-5 card-shadow border border-slate-100 flex items-center justify-between">
                            <div>
                                <p className="text-slate-500 text-xs font-semibold">ยื่นคำขอแล้ว / รอตรวจทาน</p>
                                <p className="text-2xl font-bold text-blue-600 font-inter mt-1">{statusCounts.submitted}</p>
                                <p className="text-[11px] text-blue-500 mt-1"><i className="fas fa-clock mr-1"></i>รอกลุ่มงานงบประมาณ</p>
                            </div>
                            <div className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl">
                                <i className="fas fa-paper-plane"></i>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl p-5 card-shadow border border-slate-100 flex items-center justify-between">
                            <div>
                                <p className="text-slate-500 text-xs font-semibold">ผ่านการกลั่นกรองแล้ว</p>
                                <p className="text-2xl font-bold text-purple-600 font-inter mt-1">{statusCounts.reviewed}</p>
                                <p className="text-[11px] text-purple-500 mt-1"><i className="fas fa-user-tie mr-1"></i>รอเสนอผู้บริหารอนุมัติ</p>
                            </div>
                            <div className="w-12 h-12 rounded-2xl bg-purple-50 text-brand-600 flex items-center justify-center text-xl">
                                <i className="fas fa-check-double"></i>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl p-5 card-shadow border border-slate-100 flex items-center justify-between">

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">ระดับตำแหน่ง (กรณีบ้านพัก)</label>
                                    <select 
                                        value={form.level} 
                                        onChange={e => setForm({...form, level: e.target.value})} 
                                        className="w-full input-field rounded-xl p-2.5 text-xs"
                                    >
                                        <option value="-">- (ไม่ใช่บ้านพัก)</option>
                                        <option value="ระดับ 1-2">ระดับ 1-2</option>
                                        <option value="ระดับ 3-4">ระดับ 3-4</option>
                                        <option value="ระดับ 5-6">ระดับ 5-6</option>
                                        <option value="ระดับ 7-8">ระดับ 7-8</option>
                                        <option value="ระดับ 9 ขึ้นไป">ระดับ 9 ขึ้นไป / ชั้นโท</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">จำนวน (หลัง/หน่วย) <span className="text-red-500">*</span></label>
                                    <input 
                                        required 
                                        type="number" 
                                        min="1" 
                                        value={form.quantity} 
                                        onChange={e => setForm({...form, quantity: e.target.value})} 
                                        className="w-full input-field rounded-xl p-2.5 text-xs font-inter"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">อายุอาคาร (ปี) <span className="text-red-500">*</span></label>
                                    <input 
                                        required 
                                        type="number" 
                                        min="0" 
                                        value={form.age} 
                                        onChange={e => setForm({...form, age: e.target.value})} 
                                        className="w-full input-field rounded-xl p-2.5 text-xs font-inter"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">สิทธิการใช้ประโยชน์พื้นที่ <span className="text-red-500">*</span></label>
                                    <input 
                                        required 
                                        type="text" 
                                        placeholder="เช่น ที่ราชพัสดุ, ป่าสงวนแห่งชาติ, ที่สาธารณประโยชน์"
                                        value={form.landRights} 
                                        onChange={e => setForm({...form, landRights: e.target.value})} 
                                        className="w-full input-field rounded-xl p-2.5 text-xs"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">ขนาดพื้นที่ (เนื้อที่ / ตร.ม.)</label>
                                    <input 
                                        type="text" 
                                        placeholder="เช่น 2-1-15 ไร่ หรือ 350 ตร.ม."
                                        value={form.areaSize} 
                                        onChange={e => setForm({...form, areaSize: e.target.value})} 
                                        className="w-full input-field rounded-xl p-2.5 text-xs"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">จำนวนผู้ปฏิบัติงาน (คน)</label>
                                    <input 
                                        type="number" 
                                        min="0" 
                                        value={form.staffCount} 
                                        onChange={e => setForm({...form, staffCount: e.target.value})} 
                                        className="w-full input-field rounded-xl p-2.5 text-xs font-inter"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">ค่าซ่อมแซมต่อปี (บาท)</label>
                                    <input 
                                        type="number" 
                                        min="0" 
                                        value={form.maintenanceCost} 
                                        onChange={e => setForm({...form, maintenanceCost: e.target.value})} 
                                        className="w-full input-field rounded-xl p-2.5 text-xs font-inter"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">ค่าสาธารณูปโภคต่อปี (บาท)</label>
                                    <input 
                                        type="number" 
                                        min="0" 
                                        value={form.utilityCost} 
                                        onChange={e => setForm({...form, utilityCost: e.target.value})} 
                                        className="w-full input-field rounded-xl p-2.5 text-xs font-inter"
                                    />
                                </div>
                            </div>

                            <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200">
                                    ยกเลิก
                                </button>
                                <button type="submit" className="px-5 py-2 rounded-xl text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 shadow-md">
                                    บันทึกข้อมูล
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const RequestForm = ({ onSubmit, onCancel, userProvince }) => {
            const [formData, setFormData] = useState({
                province: userProvince, 
                coordinator: `เจ้าหน้าที่ สอจ. ${userProvince}`, 
                mainCategory: mainCategories[0], 
                type: subTypes[mainCategories[0]][0],
                item: '', details: '', budget: '', reason: '',
                attachments: ['เอกสารขอตั้งงบประมาณ.pdf']
            });

            const handleCatChange = (e) => {
                const newCat = e.target.value;
                setFormData({ ...formData, mainCategory: newCat, type: subTypes[newCat][0] });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(formData);
            };

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-2xl card-shadow border border-slate-100 overflow-hidden">
                    <div className="bg-slate-50 border-b border-slate-200 px-8 py-5 flex justify-between items-center">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800 flex items-center">
                                <div className="bg-brand-100 text-brand-600 p-2 rounded-lg mr-3 text-sm">
                                    <i className="fas fa-edit"></i>
                                </div>
                                แบบฟอร์มจัดทำคำของบประมาณ (สอจ. {userProvince})
                            </h2>
                            <p className="text-slate-500 text-xs mt-1">กรอกข้อมูลและแนบเอกสารเพื่อส่งให้ส่วนกลางตรวจทาน</p>
                        </div>
                        <span className="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold">
                            ระดับปฏิบัติการ
                        </span>
                    </div>
                    
                    <form onSubmit={handleSubmit} className="p-8 space-y-6">
                        <div>
                            <h3 className="text-sm font-bold text-slate-700 mb-4 border-b border-slate-100 pb-2">1. ข้อมูลหน่วยงาน</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">จังหวัดที่รับผิดชอบ</label>
                                    <input type="text" readOnly value={userProvince} className="w-full rounded-xl input-field px-4 py-2.5 bg-slate-100 text-slate-500 font-bold" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">ผู้ประสานงาน <span className="text-red-500">*</span></label>
                                    <input required type="text" value={formData.coordinator} onChange={(e) => setFormData({...formData, coordinator: e.target.value})} placeholder="ชื่อ-สกุล เบอร์โทร" className="w-full rounded-xl input-field px-4 py-2.5" />
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 className="text-sm font-bold text-slate-700 mb-4 border-b border-slate-100 pb-2">2. รายละเอียดรายการคำขอ</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">หมวดหมู่หลัก <span className="text-red-500">*</span></label>
                                    <select value={formData.mainCategory} onChange={handleCatChange} className="w-full rounded-xl input-field px-4 py-2.5">
                                        {mainCategories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">ประเภทย่อย <span className="text-red-500">*</span></label>
                                    <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})} className="w-full rounded-xl input-field px-4 py-2.5">
                                        {subTypes[formData.mainCategory].map(t => <option key={t} value={t}>{t}</option>)}
                                    </select>
                                </div>
                            </div>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">รายการขอตั้งงบประมาณ <span className="text-red-500">*</span></label>
                                    <input required type="text" value={formData.item} onChange={(e) => setFormData({...formData, item: e.target.value})} placeholder="เช่น ก่อสร้างอาคารที่ทำการใหม่ สอจ." className="w-full rounded-xl input-field px-4 py-2.5" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">งบประมาณที่เสนอขอ (บาท) <span className="text-red-500">*</span></label>
                                    <input required type="number" min="0" value={formData.budget} onChange={(e) => setFormData({...formData, budget: e.target.value})} placeholder="ระบุวงเงินคำขอ" className="w-full rounded-xl input-field px-4 py-2.5 font-inter" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">เหตุผลความจำเป็นและคำชี้แจง <span className="text-red-500">*</span></label>
                                    <textarea required rows="3" value={formData.reason} onChange={(e) => setFormData({...formData, reason: e.target.value})} placeholder="ระบุความจำเป็นเร่งด่วน ประโยชน์ที่คาดว่าจะได้รับ..." className="w-full rounded-xl input-field px-4 py-2.5 text-sm"></textarea>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1.5">แนบเอกสารประกอบ (PDF / ZIP)</label>
                                    <div className="border-2 border-dashed border-slate-300 rounded-xl p-4 text-center bg-slate-50 hover:bg-slate-100 transition-colors cursor-pointer">
                                        <i className="fas fa-cloud-arrow-up text-brand-600 text-2xl mb-1"></i>
                                        <p className="text-xs text-slate-600 font-semibold">คลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวางที่นี่</p>
                                        <p className="text-[10px] text-slate-400 mt-1">แบบแปลน, แบบประมาณราคา, ภาพถ่ายพื้นที่ (ขนาดไม่เกิน 25MB)</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                            <button type="button" onClick={onCancel} className="px-5 py-2.5 rounded-xl font-medium text-xs text-slate-600 bg-white border border-slate-300 hover:bg-slate-50">ยกเลิก</button>
                            <button type="submit" className="px-5 py-2.5 rounded-xl font-medium text-xs text-white bg-brand-600 hover:bg-brand-700 shadow-md shadow-brand-500/30 flex items-center">
                                บันทึกและส่งคำขอให้ส่วนกลาง <i className="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        const RequestList = ({ requests, currentRole, userProvince, onUpdateStatus, onRequestReturn, onViewAttachments }) => {
            const [filterRegion, setFilterRegion] = useState('');
            const [filterCat, setFilterCat] = useState('');
            const [filterStatus, setFilterStatus] = useState('');

            let accessibleRequests = requests;
            if (currentRole === ROLES.OPERATOR.id) {
                accessibleRequests = requests.filter(r => r.province === userProvince);
            }

            const filtered = accessibleRequests.filter(r => {
                const matchRegion = filterRegion === '' || getRegion(r.province) === filterRegion;
                const matchCat = filterCat === '' || getCategoryFromType(r.type) === filterCat;
                const matchStatus = filterStatus === '' || r.status === filterStatus;
                return matchRegion && matchCat && matchStatus;
            });

            const getStatusBadge = (status) => {
                switch (status) {
                    case 'submitted':
                        return <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-blue-100 text-blue-700 border border-blue-200"><i className="fas fa-paper-plane mr-1"></i>ยื่นคำขอแล้ว</span>;
                    case 'returned':
                        return <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300"><i className="fas fa-rotate-left mr-1"></i>ส่งกลับแก้ไข</span>;
                    case 'reviewed':
                        return <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-purple-100 text-purple-800 border border-purple-200"><i className="fas fa-check-double mr-1"></i>ผ่านการกลั่นกรอง</span>;
                    case 'approved':
                        return <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300"><i className="fas fa-circle-check mr-1"></i>อนุมัติแล้ว</span>;
                    default:
                        return <span className="px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600">ร่างคำขอ</span>;
                }
            };

            return (
                <div className="bg-white rounded-2xl card-shadow border border-slate-100 flex flex-col h-[calc(100vh-170px)]">
                    <div className="p-5 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800 flex items-center">
                                <div className="bg-blue-100 text-blue-600 p-2 rounded-lg mr-2.5 text-sm">
                                    <i className="fas fa-database"></i>
                                </div>
                                ฐานข้อมูลคำของบประมาณ
                                {currentRole === ROLES.OPERATOR.id && <span className="ml-2 text-xs font-normal text-slate-500">(สอจ. {userProvince})</span>}
                            </h2>
                        </div>
                        <div className="flex flex-wrap gap-2 w-full md:w-auto">
                            {currentRole !== ROLES.OPERATOR.id && (
                                <select value={filterRegion} onChange={e => setFilterRegion(e.target.value)} className="input-field px-3 py-1.5 rounded-xl text-xs font-medium">
                                    <option value="">ทุกภูมิภาค</option>
                                    <option value="ภาคเหนือ">ภาคเหนือ</option>
                                    <option value="ภาคกลาง">ภาคกลาง</option>
                                    <option value="ภาคตะวันออกเฉียงเหนือ">ภาคอีสาน</option>
                                    <option value="ภาคตะวันออก">ภาคตะวันออก</option>
                                    <option value="ภาคตะวันตก">ภาคตะวันตก</option>
                                    <option value="ภาคใต้">ภาคใต้</option>
                                </select>
                            )}
                            <select value={filterCat} onChange={e => setFilterCat(e.target.value)} className="input-field px-3 py-1.5 rounded-xl text-xs font-medium">
                                <option value="">ทุกหมวดหมู่</option>
                                {mainCategories.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                            <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="input-field px-3 py-1.5 rounded-xl text-xs font-medium">
                                <option value="">ทุกสถานะ</option>
                                <option value="submitted">ยื่นคำขอแล้ว</option>
                                <option value="returned">ส่งกลับแก้ไข</option>
                                <option value="reviewed">ผ่านการกลั่นกรอง</option>
                                <option value="approved">อนุมัติแล้ว</option>
                            </select>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto bg-slate-50/30">
                        <table className="min-w-full text-left border-collapse">
                            <thead className="bg-slate-50 text-slate-500 sticky top-0 z-10 shadow-sm border-b border-slate-200">
                                <tr>
                                    <th className="px-5 py-3 font-semibold text-xs">จังหวัด / หน่วยงาน</th>
                                    <th className="px-5 py-3 font-semibold text-xs">หมวดหมู่</th>
                                    <th className="px-5 py-3 font-semibold text-xs">รายการคำขอ</th>
                                    <th className="px-5 py-3 font-semibold text-xs text-right">งบประมาณ (บาท)</th>
                                    <th className="px-5 py-3 font-semibold text-xs text-center">สถานะ</th>
                                    <th className="px-5 py-3 font-semibold text-xs text-center">การดำเนินการตามสิทธิ์</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 bg-white">
                                {filtered.map(req => (
                                    <tr key={req.id} className="hover:bg-slate-50 transition-colors">
                                        <td className="px-5 py-3.5">
                                            <div className="font-bold text-xs text-slate-800">{req.province}</div>
                                            <div className="text-[10px] text-slate-400 mt-0.5">{getRegion(req.province)}</div>
                                        </td>
                                        <td className="px-5 py-3.5">
                                            <span className="px-2.5 py-0.5 rounded-md text-[11px] font-medium bg-brand-50 text-brand-700 border border-brand-100 inline-block">
                                                {getCategoryFromType(req.type)}
                                            </span>
                                        </td>
                                        <td className="px-5 py-3.5 max-w-xs">
                                            <div className="text-xs font-semibold text-slate-800">{req.item}</div>
                                            {req.status === 'returned' && req.revisionNote && (
                                                <div className="text-[11px] text-amber-700 bg-amber-50 p-1.5 rounded-lg border border-amber-200 mt-1">
                                                    <strong>ข้อเสนอแนะ:</strong> {req.revisionNote}
                                                </div>
                                            )}
                                        </td>
                                        <td className="px-5 py-3.5 text-right font-bold text-xs text-slate-800 font-inter">
                                            {new Intl.NumberFormat('th-TH').format(req.budget)}
                                        </td>
                                        <td className="px-5 py-3.5 text-center">
                                            {getStatusBadge(req.status)}
                                        </td>
                                        <td className="px-5 py-3.5 text-center">
                                            <div className="flex items-center justify-center gap-1.5">
                                                <button onClick={() => onViewAttachments(req)} className="text-slate-500 hover:text-brand-600 p-1.5 rounded-lg hover:bg-slate-100 text-xs" title="ดูเอกสารแนบ">
                                                    <i className="fas fa-paperclip"></i>
                                                </button>

                                                {currentRole === ROLES.OPERATOR.id && req.status === 'returned' && (
                                                    <button 
                                                        onClick={() => onUpdateStatus(req.id, 'submitted', '')}
                                                        className="px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-[11px] font-bold shadow-sm flex items-center gap-1"
                                                    >
                                                        <i className="fas fa-paper-plane"></i> ยื่นแก้ไข
                                                    </button>
                                                )}

                                                {currentRole === ROLES.CENTRAL.id && (
                                                    <>
                                                        {req.status === 'submitted' && (
                                                            <>
                                                                <button 
                                                                    onClick={() => onUpdateStatus(req.id, 'reviewed')}
                                                                    className="px-2 py-1 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-[11px] font-semibold"
                                                                    title="ตรวจทานและส่งผู้บริหาร"
                                                                >
                                                                    <i className="fas fa-check mr-1"></i>ผ่านกลั่นกรอง
                                                                </button>
                                                                <button 
                                                                    onClick={() => onRequestReturn(req)}
                                                                    className="px-2 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-[11px] font-semibold"
                                                                    title="คืนให้ สอจ. แก้ไข"
                                                                >
                                                                    <i className="fas fa-rotate-left mr-1"></i>คืนแก้ไข
                                                                </button>
                                                            </>
                                                        )}
                                                    </>
                                                )}

                                                {currentRole === ROLES.EXECUTIVE.id && (
                                                    <>
                                                        {req.status === 'reviewed' && (
                                                            <button 
                                                                onClick={() => onUpdateStatus(req.id, 'approved')}
                                                                className="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[11px] font-bold shadow-sm"
                                                            >
                                                                <i className="fas fa-check-circle mr-1"></i>อนุมัติ
                                                            </button>
                                                        )}
                                                    </>
                                                )}
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <div className="p-4 bg-white border-t border-slate-100 flex justify-between items-center text-xs">
                        <span className="text-slate-500">แสดงข้อมูล {filtered.length} รายการ</span>
                        <div>
                            <span className="text-slate-500 mr-2">รวมงบประมาณ:</span>
                            <span className="text-base font-bold text-brand-700 font-inter">{formatCurrency(filtered.reduce((s, r) => s + Number(r.budget), 0))}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
